-dai-nua","CreatedDate":"2026-07-05T13:01:08.023Z","ModifiedDate":"2026-07-05T17:46:28.849Z","SeoTitle":"Đều Trọng Sinh Rồi, Ai Còn Giả Là Phú Nhị Đại Nữa","SeoUrl":"deu-trong-sinh-roi-ai-con-gia-la-phu-nhi-dai-nua","SeoKeywords":"Đều Trọng Sinh Rồi, Ai Còn Giả Là Phú Nhị Đại Nữa","SeoDescription":"Đều Trọng Sinh Rồi, Ai Còn Giả Là Phú Nhị Đại Nữa","Authors":[2934],"Speakers":[112270],"SubCategories":[476,473,438,478,482],"CategoryId":432,"ContentTitle":"Đều Trọng Sinh Rồi, Ai Còn Giả Là Phú Nhị Đại Nữa","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"【Trọng sinh + sân trường + đơn nữ chính + quần tượng + dòng đời sống + dòng hiểu lầm】\nNăm ba mươi mốt tuổi, Lục Xuyên chết trong một vụ tai nạn xe cộ.\nTrước khi chết, hắn vẫn luôn nghĩ, mấy năm liều mạng giả làm phú nhị đại của mình, rốt cuộc có ý nghĩa gì.\nKhi mở mắt lần nữa, hắn đã trở về năm mười tám tuổi, trở về trước khi mọi chuyện bắt đầu.\nKiếp này, hắn không còn bước vào những bữa tiệc rượu ồn ào ấy nữa.\nHắn mua một chiếc xe rất yên tĩnh, một căn nhà rất yên tĩnh, sau đó bắt đầu học cách sống một cuộc đời thật yên tĩnh.\nHắn vốn cho rằng như vậy là có thể thoát khỏi cái bóng của quá khứ.\nNhưng hắn không ngờ rằng, khi một người thật sự bắt đầu nghiêm túc sống cuộc đời của mình, bản thân người đó sẽ trở thành ánh sáng chói lọi nhất trong mắt người khác.","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F07\u002Fdeu-trong-sinh-roi-ai-con-gia-la-phu-nhi-dai-nua-d01fa.jpg","ChapterCount":383,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2934","ContentTitle":"Ái Hòa Mỹ Thức","SeoUrl":"tac-gia-ai-hoa-my-thuc"}]},{"_id":"4630","Alias":"ta-dung-nghe-phu-cong-thien-phu","CreatedDate":"2026-07-01T09:50:07.240Z","ModifiedDate":"2026-07-01T10:38:58.128Z","SeoTitle":"Ta Dùng Nghề Phụ Cộng Thiên Phú","SeoUrl":"ta-dung-nghe-phu-cong-thien-phu","SeoKeywords":"Ta Dùng Nghề Phụ Cộng Thiên Phú","SeoDescription":"Ta Dùng Nghề Phụ Cộng Thiên Phú","Authors":[2843],"Speakers":[112270],"SubCategories":[435,450,443,482,493],"CategoryId":432,"ContentTitle":"Ta Dùng Nghề Phụ Cộng Thiên Phú","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"FULL","Note3":"","Note5":"","Note9":"","Recap":"Yêu ma hoành hành, quỷ quái tàn phá, thiên hạ đại loạn, dân chúng lầm than.\nTống Phúc Lộc xuyên không đến thế giới khác, thức tỉnh bảng thuộc tính. Hắn có thể thông qua việc nâng cấp nghề phụ để nhận được điểm thiên phú tự do, dùng chúng nâng cấp thiên phú tu luyện và thiên phú phụ trợ.\nLuyện Khí thuật tăng một cấp, nhận được một điểm thiên phú tự do!\nTrồng Trọt thuật tăng ba cấp, nhận được ba điểm thiên phú tự do!\nLuyện Đan thuật tăng mười cấp, nhận được mười điểm thiên phú tự do!\n...\nDồn toàn bộ vào thiên phú tu luyện, biến bản thân từ kẻ tầm thường thành người có tư chất tốt, từ người có tư chất tốt thành thiên tài, từ thiên tài thành yêu nghiệt. Bất kỳ công pháp nào chỉ cần liếc mắt đã có thể lĩnh ngộ, bất kỳ thần thông nào chỉ cần nhìn qua đã thấu suốt. Tu hành một ngày, sánh bằng người thường mười năm.\nỞ thế giới chính, ta cẩn trọng vững vàng như lão cẩu. Tại các tiểu thế giới, ta quét ngang vô địch. Mỗi lần giáng lâm, chiến lực đều tăng gấp bội. Giai đoạn đầu chủ yếu dựa vào thiên phú và tư chất cực cao để nâng cảnh giới tu vi; giai đoạn giữa và cuối chủ yếu dựa vào giáng lâm để tiến bộ vượt bậc. Tuyệt không dây dưa lề mề, một đường trưởng thành với tốc độ cao, quét ngang mọi kẻ địch.\n【Dòng cẩu đạo + vô hạn lưu + trường sinh lưu, lượng đặt đọc cao khoảng tám nghìn, kính mời thưởng thức.】","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F06\u002Fta-dung-nghe-phu-cong-thien-phu-721d8.jpg","ChapterCount":682,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2843","ContentTitle":"Bình An Hân Thành","SeoUrl":"tac-gia-binh-an-han-thanh"}]},{"_id":"4469","Alias":"sau-khi-da-tra-nu-hoa-khoi-cam-diec-noi-nang-la-vi-hon-the-tu-nho-cua-ta","CreatedDate":"2026-05-22T09:11:23.682Z","ModifiedDate":"2026-05-22T10:10:52.786Z","SeoTitle":"Sau Khi Đá Tra Nữ, Hoa Khôi Câm Điếc Nói Nàng Là Vị Hôn Thê Từ Nhỏ Của Ta!","SeoUrl":"sau-khi-da-tra-nu-hoa-khoi-cam-diec-noi-nang-la-vi-hon-the-tu-nho-cua-ta","SeoKeywords":"Sau Khi Đá Tra Nữ, Hoa Khôi Câm Điếc Nói Nàng Là Vị Hôn Thê Từ Nhỏ Của Ta!","SeoDescription":"Sau Khi Đá Tra Nữ, Hoa Khôi Câm Điếc Nói Nàng Là Vị Hôn Thê Từ Nhỏ Của Ta!","Authors":[2062],"Speakers":[112270],"SubCategories":[473,476,438,490,470,482],"CategoryId":432,"ContentTitle":"Sau Khi Đá Tra Nữ, Hoa Khôi Câm Điếc Nói Nàng Là Vị Hôn Thê Từ Nhỏ Của Ta!","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"Nhân vật chính: Giang Trừng, Thẩm Thanh Lê\nKiếp trước, Giang Trừng bị bạn gái đâm sau lưng. Sau khi trọng sinh, hắn quả quyết lựa chọn chia tay với tra nữ này.\nNhưng không ngờ, trong một lần âm sai dương thác, hắn lại cùng chị gái của bạn gái cũ bị người ta hạ thuốc điên đảo một đêm trong khách sạn.\nSau khi ăn sạch lau mép, cả hai đều cho rằng đời này sẽ không còn bất kỳ liên quan nào nữa. Nào ngờ đến khi khai giảng mới phát hiện, Kiều Cẩn Nguyệt vậy mà lại trở thành tân phụ đạo viên đại học của Giang Trừng hắn?\nKhông chỉ như vậy, vị hoa khôi câm Thẩm Thanh Lê được toàn trường tôn làm bạch nguyệt quang tuyệt mỹ kia, thế mà còn là vị hôn thê có hôn ước từ nhỏ của hắn?\nChết tiệt! Đã trọng sinh rồi, chó mới yêu đương!\nSự nghiệp mới là bến đỗ cuối cùng của nam nhân.\nKiều Vi Vi hối hận chủ động dâng mình, Kiều Cẩn Nguyệt thanh lãnh dè dặt, Thẩm Thanh Lê vụng về chân thành…… Giang Trừng bỗng cảm thấy, có lẽ đời này sẽ là một cuộc nhân sinh đặc sắc theo một cách khác.","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F05\u002Fsau-khi-da-tra-nu-hoa-khoi-cam-diec-noi-nang-la-vi-hon-the-tu-nho-cua-ta.jpg","ChapterCount":229,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2062","ContentTitle":"Bát Phương Lai Tài","SeoUrl":"tac-gia-bat-phuong-lai-tai"}]},{"_id":"4568","Alias":"cuc-do-luan-ham-cuop-doi-tuong-cua-ty-ty-dien-cuong-chuan-bi-mang-thai","CreatedDate":"2026-06-15T03:20:25.171Z","ModifiedDate":"2026-06-15T07:20:40.010Z","SeoTitle":"Cực Độ Luân Hãm! Cướp Đối Tượng Của Tỷ Tỷ, Điên Cuồng Chuẩn Bị Mang Thai","SeoUrl":"cuc-do-luan-ham-cuop-doi-tuong-cua-ty-ty-dien-cuong-chuan-bi-mang-thai","SeoKeywords":"Cực Độ Luân Hãm! Cướp Đối Tượng Của Tỷ Tỷ, Điên Cuồng Chuẩn Bị Mang Thai","SeoDescription":"Cực Độ Luân Hãm! Cướp Đối Tượng Của Tỷ Tỷ, Điên Cuồng Chuẩn Bị Mang Thai","Authors":[2490],"Speakers":[112270],"SubCategories":[437,474,481,475,438,478,476,473,490],"CategoryId":432,"ContentTitle":"Cực Độ Luân Hãm! Cướp Đối Tượng Của Tỷ Tỷ, Điên Cuồng Chuẩn Bị Mang Thai","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"Nhân vật chính: Thư Tâm, Trì Vân Hiến\n【Quyến rũ thượng vị ➕ vĩnh viễn khống chế ➕ giằng co cực hạn ➕ hơi có hơi hướng vạn nhân mê ➕ Tu La tràng】\n【Kẻ thượng vị mạnh mẽ, dục vọng khống chế cực cao vì yêu mà cúi đầu ✖ đại mỹ nhân kiều diễm】\n【Vô hạn sủng nữ chính, tiện thể vả mặt đám nhân tra phối giác】\nĐời trước, Thư Tâm là tư sinh nữ không lên nổi mặt bàn của Thư gia, đại học bỏ dở, học vấn chỉ đến cấp ba, bị xúi giục chơi cổ phiếu rồi nhiễm thói nghiện cờ bạc, tiếng xấu lan xa, trong giới danh lưu còn bị gọi đùa là bình hoa kém chất lượng.\nTỷ tỷ cùng cha khác mẹ của nàng tốt nghiệp nghiên cứu sinh từ danh giáo, được xưng là tài học hơn người, tự cho mình cao quý.\nThư gia ngoài mặt đối xử hòa thuận với nàng, thực chất lại chỉ coi nàng như túi máu.\nTrong giới ai nấy đều cười nhạo, kết cục của nàng thảm liệt...\nKhông sao cả, nàng đã trọng sinh rồi.\nVị thánh thủ nội khoa cao quý tuyệt luân, thanh lãnh cấm dục, là người mà cả giới thượng lưu không dám trêu chọc kia, thật ngại quá, nàng cướp mất rồi.\n——\nBốn giờ sáng, Thư Tâm vừa ê ẩm vừa đau nhức, bụng đã đói đến không chịu nổi. Không đợi được dì giúp việc dậy làm bữa sáng, nàng lại xuống giường, chạy qua chạy lại trong phòng, muốn tìm chút đồ ăn vặt.\nNàng chỉ khoác một chiếc áo sơ mi của Trì Vân Hiến. Chiếc áo rộng rãi lỏng lẻo, để lộ một đoạn cổ chân trắng nõn mảnh mai. Theo từng động tác của nàng, cảnh xuân dưới vạt áo lúc ẩn lúc hiện.\nNam nhân khoác một chiếc áo ngủ, tấm rèm dày nặng ngăn cách ánh trăng bạc bên ngoài.\nDưới ngọn đèn dịu nơi đầu giường, đường nét cằm của Trì Vân Hiến hiện lên sắc bén lạnh cứng, mày mắt vẫn xem như bình tĩnh không gợn sóng, đôi mắt đen sâu không thấy đáy.\nĐầu ngón tay hắn kẹp ly rượu, ánh mắt từng tấc từng tấc lướt qua Thư Tâm, rồi nói:\n“Hoặc là cởi hết, hoặc là mặc vào cho đàng hoàng.”\n——\nNam nhân đêm đêm mất khống chế vì nàng, khi thì hai tay ôm lấy, khi thì một tay kéo nàng ngồi vào lòng, hết lần này đến lần khác dây dưa, triền miên khăng khít...","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F06\u002Fcuc-do-luan-ham-cuop-doi-tuong-cua-ty-ty-dien-cuong-chuan-bi-mang-thai-82314.jpg","ChapterCount":147,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2490","ContentTitle":"Cử Trứ Anh Đào Đích Trương Mỗ Mỗ","SeoUrl":"tac-gia-cu-tru-anh-dao-dich-truong-mo-mo"}]},{"_id":"4666","Alias":"loan-the-vo-thanh-khoi-dau-tu-cay-do-thanh-thuc","CreatedDate":"2026-07-06T08:17:52.094Z","ModifiedDate":"2026-07-06T08:39:21.076Z","SeoTitle":"Loạn Thế Võ Thánh: Khởi Đầu Từ Cày Độ Thành Thục","SeoUrl":"loan-the-vo-thanh-khoi-dau-tu-cay-do-thanh-thuc","SeoKeywords":"Loạn Thế Võ Thánh: Khởi Đầu Từ Cày Độ Thành Thục","SeoDescription":"Loạn Thế Võ Thánh: Khởi Đầu Từ Cày Độ Thành Thục","Authors":[2960],"Speakers":[112270],"SubCategories":[435,443,440],"CategoryId":432,"ContentTitle":"Loạn Thế Võ Thánh: Khởi Đầu Từ Cày Độ Thành Thục","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"Lòng dâng trào nhiệt huyết, muôn vàn huyễn tưởng. Đón gió vung quyền, dậy lên ngàn tầng sóng lớn; thiếu niên nhiệt huyết, bất bại không lùi!\nLoạn thế vẩn đục, võ đạo thông thiên. Cường giả có thể dời non lấp biển, kẻ yếu thì tính mạng mỏng manh như cỏ rác.\nChu Nguyên là một phu khuân vác ở bến tàu, chật vật sinh tồn nơi đáy tầng lớp dân nghèo của Ô Nê Hạng. Căn cốt của hắn chỉ ở mức trung hạ, gia cảnh lại sa sút.\nThế nhưng, trong tuyệt cảnh, hắn lại thức tỉnh bảng điều khiển 【Thiên Đạo Thù Cần】!\nChỉ cần nỗ lực, ắt sẽ có thu hoạch!\nBát Hoang Lục Hợp Công, Thiên Đô Phong Ma Quyền, Long Tượng Bát Nhã Kình...\nNhững tuyệt thế võ học mà người thường dốc hết cả đời cũng khó lòng chạm tới cánh cửa nhập môn, đối với hắn lại chỉ là thành quả đến tự nhiên sau những tháng ngày cần mẫn.\nTừ một học đồ võ quán, đến Chỉ huy sứ Tĩnh Dạ Ty, rồi trở thành Tịnh Kiên Vương quyền khuynh thiên hạ.\nChu Nguyên không kính quỷ thần, chỉ tin vào nắm đấm trong lòng bàn tay, cùng thanh đao bên hông mình!\nKhi quyền ý đủ sức rung chuyển hoàn vũ phá tan tầng mây, xông thẳng lên chín tầng trời, thế nhân mới hiểu—\nĐây chính là Võ Thánh giáng trần!","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F07\u002Floan-the-vo-thanh-khoi-dau-tu-cay-do-thanh-thuc-8aafb.jpg","ChapterCount":123,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2960","ContentTitle":"Tả Thủ Chấp Ma","SeoUrl":"tac-gia-ta-thu-chap-ma"}]},{"_id":"4485","Alias":"ke-thu-ba-tram-nam-truoc-nay-tro-thanh-phu-quan-cua-ta","CreatedDate":"2026-05-27T07:13:11.432Z","ModifiedDate":"2026-05-27T07:33:34.520Z","SeoTitle":"Kẻ Thù Ba Trăm Năm Trước Nay Trở Thành Phu Quân Của Ta","SeoUrl":"ke-thu-ba-tram-nam-truoc-nay-tro-thanh-phu-quan-cua-ta","SeoKeywords":"Kẻ Thù Ba Trăm Năm Trước Nay Trở Thành Phu Quân Của Ta","SeoDescription":"Kẻ Thù Ba Trăm Năm Trước Nay Trở Thành Phu Quân Của Ta","Authors":[2134],"Speakers":[112270],"SubCategories":[476,473,437,474,481],"CategoryId":432,"ContentTitle":"Kẻ Thù Ba Trăm Năm Trước Nay Trở Thành Phu Quân Của Ta","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"Nhân vật chính: Sở Chiêu, Yến Phù Nguy\nSở Chiêu chết đi ba trăm năm trở thành Quỷ vương, một sớm mở mắt tỉnh lại, nàng lại biến thành một vị Vương phi ngốc nghếch.\nTin tốt: Phu quân của cái thân xác này, ngay từ đêm tân hôn của năm năm trước đã bỏ trốn ra biên quan đánh giặc rồi.\nTin xấu: Người sống sờ sờ đã quay trở về.\nTin càng xấu hơn nữa: Sau khi nàng chết đi ở kiếp trước, tên tử đối đầu (kẻ thù không đội trời chung) đã thành công thống nhất thiên hạ, đăng cơ xưng Đế. Thế mà bây giờ nàng lại biến thành Vương phi của một trong những con cháu đời sau của tên tử đối đầu đó!\nTừ từ đã nào, cái thằng cháu chắt này làm sao mà trông giống hệt như tên tử đối đầu của nàng ở kiếp trước vậy chứ?\n......\nYến Phù Nguy kiệt sức làm lụng đến mức bỏ mạng ngay trên ngự tọa, khi mở mắt ra lần nữa, hắn lại biến thành đứa con cháu nhát cáy phế vật của vị đệ đệ nhà mình.\nGiang sơn được giành lấy bằng việc dốc hết tâm can gan ruột, trơ mắt nhìn cảnh sắp sửa bị đám con cháu bất hiếu này đem đi chôn vùi hủy hoại, Bạch Thịnh Đế Yến Phù Nguy vốn là bậc Thánh quân khai quốc ở kiếp trước đành phải vừa mới trọng sinh liền lập tức tức tốc chạy ra chiến trường.\nSau khi đánh cho Man tộc tơi bời hoa lá ném mũ cởi giáp, hắn liền hồi kinh với sự chuẩn bị đem từng tên từng tên bất hiếu tử tôn ra làm thịt để tế thiên.\nTrở lại kinh thành rồi, hắn mới sực nhớ ra cái thân xác này thế mà lại đã cưới vợ, thật trùng hợp làm sao, đối phương lại chính là cháu gái ở đời sau của vị tử đối đầu kia.\nNgười đời vẫn luôn đồn đại rằng hắn và Huyền Chiêu Vương là một đôi tử đối đầu không chết không ngớt. Cũng đúng, quả thật là chỉ cần chưa đến mức chết ở trên giường, thì sẽ không thể ngưng nghỉ.\nThế nhưng cái nữ nhân kia ngủ với hắn xong liền lập tức quất ngựa truy phong thì cũng thôi đi, đằng này lại còn giở mặt vô tình không nhận người quen. Chẳng kịp chờ đến lúc hắn được đương diện chất vấn nàng, nàng lại có thể nhanh chân hơn hắn một bước mà chết đi hay sao?\nTrùng hợp hơn nữa là, Yến Phù Nguy bỗng phát hiện ra, vị Vương phi của hắn ở kiếp này sao càng nhìn lại càng giống cô ả tra nữ của năm xưa vậy?\nSở Chiêu: Bổn vương Huyền Chiêu, ngoan ngoãn đưa máu cho ta hút một ngụm, ta dẫn ngươi đi Vấn Đỉnh Thiên Hạ, tạo phản giật lấy giang sơn của Yến gia nhà hắn!\nYến Phù Nguy: Đem cái mạng này giao luôn cho nàng có được hay không? Cùng bích lạc hạ hoàng tuyền, nàng là của ta, cái mạng này của ta cũng là của nàng!","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F05\u002Fke-thu-ba-tram-nam-truoc-nay-tro-thanh-phu-quan-cua-ta.jpg","ChapterCount":104,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2134","ContentTitle":"Nhất Oản Phật Khiêu Tường","SeoUrl":"tac-gia-nhat-oan-phat-khieu-tuong"}]},{"_id":"4529","Alias":"trong-sinh-roi-ai-con-lam-minh-tinh","CreatedDate":"2026-06-09T01:38:58.495Z","ModifiedDate":"2026-06-09T02:11:30.761Z","SeoTitle":"Trọng Sinh Rồi Ai Còn Làm Minh Tinh","SeoUrl":"trong-sinh-roi-ai-con-lam-minh-tinh","SeoKeywords":"Trọng Sinh Rồi Ai Còn Làm Minh Tinh","SeoDescription":"Trọng Sinh Rồi Ai Còn Làm Minh Tinh","Authors":[202490],"Speakers":[112270],"SubCategories":[438,476,478,473,504],"CategoryId":432,"ContentTitle":"Trọng Sinh Rồi Ai Còn Làm Minh Tinh","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"FULL","Note3":"","Note5":"","Note9":"","Recap":"“Vì sao ngươi lại dây dưa không rõ với nhiều nữ hài tử như vậy?”\n“Đừng nói bậy, ta rất chung tình.”\n“Là chung tình với từng nữ hài tử sao?”\n“Không, là chỉ thích nữ hài tử.”\nNgươi vĩnh viễn sẽ không biết, nữ thần mà ngươi thầm mến có thể chủ động đến mức nào.\nSau khi trọng sinh.\nLâm Lạc đã biết.","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F06\u002Ftrong-sinh-roi-ai-con-lam-minh-tinh.jpg","ChapterCount":465,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"202490","ContentTitle":"Ngã Tối Bạch","SeoUrl":"nga-toi-bach"}]},{"_id":"4321","Alias":"bi-ep-the-gia-ac-quy-tan-tat-nu-phu-ca-muoi-dao-nguoc-hao-mon-nam-gon-sung-ai-toan-cuc","CreatedDate":"2026-04-15T18:02:55.912Z","ModifiedDate":"2026-04-16T02:15:53.036Z","SeoTitle":"Bị Ép Thế Giá Ác Quỷ Tàn Tật? Nữ Phụ Cá Muối Đảo Ngược Hào Môn Nắm Gọn Sủng Ái Toàn Cục!","SeoUrl":"bi-ep-the-gia-ac-quy-tan-tat-nu-phu-ca-muoi-dao-nguoc-hao-mon-nam-gon-sung-ai-toan-cuc","SeoKeywords":"Bị Ép Thế Giá Ác Quỷ Tàn Tật? Nữ Phụ Cá Muối Đảo Ngược Hào Môn Nắm Gọn Sủng Ái Toàn Cục!","SeoDescription":"Bị Ép Thế Giá Ác Quỷ Tàn Tật? Nữ Phụ Cá Muối Đảo Ngược Hào Môn Nắm Gọn Sủng Ái Toàn Cục!","Authors":[1193],"Speakers":[112270],"SubCategories":[437,481,474,475,473,476,490],"CategoryId":432,"ContentTitle":"Bị Ép Thế Giá Ác Quỷ Tàn Tật? Nữ Phụ Cá Muối Đảo Ngược Hào Môn Nắm Gọn Sủng Ái Toàn Cục!","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"FULL","Note3":"","Note5":"","Note9":"","Recap":"Chỉ sau khi nhắm mắt xuôi tay trút đi hơi thở cuối cùng, Nguyễn Hàn Tinh mới bàng hoàng phát giác ra rằng, cái thế giới mà nàng đang sống này chung quy cũng chỉ là một quyển tiểu thuyết ngọt sủng lấy đứa muội muội cùng cha khác mẹ của nàng - Nguyễn Vị Tư - làm nhân vật chính tâm điểm mà thôi.\nMà sự tồn tại của bản thân nàng ở bên trong đó, cũng chẳng qua chỉ được phác họa vội vã thưa thớt bằng dăm ba câu chữ miêu tả dành cho một đứa pháo hôi cực kỳ tầm thường, cuối cùng cứ như vậy bỏ mạng chết đi một cách thầm lặng chẳng gây nổi một tiếng vang nào.\nTrùng sinh trở lại năm mười chín tuổi thanh xuân, mọi sự khát cầu dằn vặt thèm muốn có được phần tình cảm phụ ái thảy đều bị nàng triệt để xua tan không chừa lại dấu vết, một người từng khăng khăng điên cuồng hiếu thắng tranh đoạt thiệt hơn với đời như nàng lại dứt khoát quyết định buông xuôi, bước vào lối sống hệ Phật không màng thế sự.\nThay thế tỷ muội xuất giá? Người trượng phu tương lai bị tàn tật lại còn mắc phải căn bệnh tâm lý nghiêm trọng?\nLàm một vị cá muối hào môn sống nhàn nhã qua ngày trong vai trò khoát thái thái chẳng phải là rất sung sướng thoải mái thơm tho sao?\nSống lại kiếp này, nàng đã không còn khao khát cố chấp đi mưu toan cướp đoạt mớ vật chất không thuộc về chính bản thân mình nữa, điều duy nhất nàng ước nguyện chỉ là an phận thủ thường âm thầm bám trụ thủ hộ những người thân nhân cùng bằng hữu thiết hữu thân thiết nhất, sống cho thật trọn vẹn những ngày tháng yên ả thanh bình.\nGã nam nhân đã được ấn định sẵn cái mác đoản mệnh chết yểu sớm sủa khẽ cong lên khóe môi mỉm cười tà mị cất tiếng:\n\"Không có bất kỳ quan hệ gì cản trở cả, lũ rác rưởi khốn kiếp nào trót lỡ mang mật gấu dòm ngó ức hiếp bà xã bảo bối của ta, ta sẽ tự thân ra mặt dọn dẹp nhổ cỏ tận gốc bọn chúng!\"\nPhim ngắn chiếu mạng vi đoản kịch (mini drama) 《 Phu Nhân Khả Bất Thị Sỏa Bạch Điềm 》 đang trong quá trình khẩn trương hoàn thành chế tác chế tác~","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F04\u002Fbi-ep-the-gia-ac-quy-tan-tat-nu-phu-ca-muoi-dao-nguoc-hao-mon-nam-gon-sung-ai-toan-cuc.jpg","ChapterCount":1787,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"1193","ContentTitle":"Hành Đăng Trung Hạ Du","SeoUrl":"tac-gia-hanh-dang-trung-ha-du"}]},{"_id":"4422","Alias":"trong-sinh-ngay-ban-hon-tro-thanh-tieu-hoang-tham-cua-tra-nam","CreatedDate":"2026-05-12T03:22:44.642Z","ModifiedDate":"2026-06-20T06:59:44.325Z","SeoTitle":"Trọng Sinh Ngày Ban Hôn: Trở Thành Tiểu Hoàng Thẩm Của Tra Nam","SeoUrl":"trong-sinh-ngay-ban-hon-tro-thanh-tieu-hoang-tham-cua-tra-nam","SeoKeywords":"Trọng Sinh Ngày Ban Hôn: Trở Thành Tiểu Hoàng Thẩm Của Tra Nam","SeoDescription":"Trọng Sinh Ngày Ban Hôn: Trở Thành Tiểu Hoàng Thẩm Của Tra Nam","Authors":[1833],"Speakers":[112270],"SubCategories":[476,473,475,440,437],"CategoryId":432,"ContentTitle":"Trọng Sinh Ngày Ban Hôn: Trở Thành Tiểu Hoàng Thẩm Của Tra Nam","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"Nhân vật chính: Thẩm Dược, Tạ Cảnh Sơ\n【 Nữ chính cùng tra nam song trọng sinh + Nam phụ thượng vị + Cưới trước yêu sau + Song hướng cứu rỗi + Tra nam hỏa táng tràng 】\nThẩm Dược là cô nhi của Tướng quân phủ, Hoàng đế thương xót, muốn ban hôn cho nàng.\nKiếp trước, Thẩm Dược gả cho Thái tử Tạ Cảnh Sơ.\nNàng ở trong Đông Cung chịu đủ mọi nhục nhã, lại còn nghe thấy Tạ Cảnh Sơ lén lút buông lời khinh bỉ: \"Cố tình ép gả cho ta, đây là do ả đáng đời chịu tội.\"\nThẩm Dược tâm tàn ý lạnh, đưa ra đề nghị hòa ly.\nĐêm trước ngày rời cung, Thẩm Dược trọng sinh quay trở lại năm mười bảy tuổi.\nHoàng đế ngồi ngay ngắn ở vị trí bề trên, ngậm cười hỏi nàng: \"Ngươi thích ai? Cứ việc nói cho Trẫm biết.\"\nThẩm Dược cúi đầu, \"Thần nữ đã ái mộ Tĩnh Vương từ lâu.\"\nTĩnh Vương Tạ Uyên, tuấn mỹ vô trù, kinh tài tuyệt diễm.\nThế nhưng trong một trận đại chiến lại bị thương nặng, hôn mê bất tỉnh.\nĐại phu nói, e rằng cả đời này cũng chỉ có thể nằm như vậy.\nAi nấy đều nói Thẩm Dược hồ đồ.\nNhưng mà kiếp trước lúc bị người ta bắt nạt, chỉ có một mình Tạ Uyên hướng nàng vươn tay ra.\nTạ Cảnh Sơ dần dần thức tỉnh lại ký ức của kiếp trước.\nHắn giống như phát điên mà xông vào Tĩnh Vương phủ, muốn mang Thẩm Dược đi.\nNhưng lại chỉ nhìn thấy bức sa trướng rủ xuống, một bóng dáng kiều nhỏ đang ngủ ngon lành ở trên giường.\nVị Cửu thúc mà hắn vô cùng kính sợ từ nhỏ đến lớn kia đang ngồi ở mép giường, mang vẻ mặt tựa tiếu phi tiếu nhìn về phía hắn: \"Nếu như ồn ào làm ầm đến thẩm thẩm của ngươi ngủ, thì đừng hòng tiếp tục làm Thái tử nữa.\"","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F05\u002Ftrong-sinh-ngay-ban-hon-tro-thanh-tieu-hoang-tham-cua-tra-nam.jpg","ChapterCount":565,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"1833","ContentTitle":"Tiểu Phiến","SeoUrl":"tac-gia-tieu-phien"}]},{"_id":"4517","Alias":"bat-dau-cuu-long-doat-dich-khong-tranh-hoang-vi-ta-lam-than-con","CreatedDate":"2026-06-06T01:32:07.135Z","ModifiedDate":"2026-06-06T05:02:27.085Z","SeoTitle":"Bắt Đầu Cửu Long Đoạt Đích, Không Tranh Hoàng Vị, Ta Làm Thần Côn","SeoUrl":"bat-dau-cuu-long-doat-dich-khong-tranh-hoang-vi-ta-lam-than-con","SeoKeywords":"Bắt Đầu Cửu Long Đoạt Đích, Không Tranh Hoàng Vị, Ta Làm Thần Côn","SeoDescription":"Bắt Đầu Cửu Long Đoạt Đích, Không Tranh Hoàng Vị, Ta Làm Thần Côn","Authors":[2300],"Speakers":[112270],"SubCategories":[490,470,434,435,476,473],"CategoryId":432,"ContentTitle":"Bắt Đầu Cửu Long Đoạt Đích, Không Tranh Hoàng Vị, Ta Làm Thần Côn","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"Lạc Gia Hào vừa mở đầu đã trọng sinh vào trong bụng mẹ. May mà kiếp trước hiểu được một ít thuật hô hấp thổ nạp, giữ lại được trong cơ thể một tia tiên thiên chi khí, sớm đả thông hai mạch Nhâm Đốc. Sau khi sinh ra, hắn mới phát hiện mình đã đến cổ đại, hơn nữa còn không phải triều đại nào trong ký ức của Lạc Gia Hào. Một đời này, hắn tên là Lạc Chiêu Hành, hơn nữa còn là một hoàng tử, xếp thứ mười một trong các hoàng tử. Từ đôi câu vài lời của cung nữ, thái giám và nhũ mẫu, hắn biết phụ hoàng mình là Huyền Hi Đế rất lợi hại, mấy vị hoàng huynh lớn tuổi hơn kia cũng đều rất xuất sắc, có thể xưng là nhân kiệt!\nLạc Gia Hào trọng sinh thành Lạc Chiêu Hành trong lòng rất hoảng, chỉ sợ bản thân sẽ bị vị hảo huynh đệ nào đó, hoặc vị di nương nào đó nhân đạo hủy diệt.\nNghĩ đến đây, Lạc Chiêu Hành cảm thấy ngay cả bú sữa cũng không còn dục vọng nữa, chỉ sợ thứ mình uống vào là sữa độc! Ngày thường nhìn ai hắn cũng cảm thấy, luôn có điêu dân muốn hại trẫm!\nCứ như vậy, Lạc Chiêu Hành sống trong nơm nớp lo sợ cho đến...","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F06\u002Fbat-dau-cuu-long-doat-dich-khong-tranh-hoang-vi-ta-lam-than-con.jpg","ChapterCount":319,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2300","ContentTitle":"Ngã Tòng Phái Huyền Lai","SeoUrl":"tac-gia-nga-tong-phai-huyen-lai"}]},{"_id":"4519","Alias":"truong-sinh-tu-tien-bat-dau-cay-do-thuan-thuc-tu-ngu-nong","CreatedDate":"2026-06-06T16:21:50.448Z","ModifiedDate":"2026-06-06T16:56:02.769Z","SeoTitle":"Trường Sinh Tu Tiên, Bắt Đầu Cày Độ Thuần Thục Từ Ngư Nông","SeoUrl":"truong-sinh-tu-tien-bat-dau-cay-do-thuan-thuc-tu-ngu-nong","SeoKeywords":"Trường Sinh Tu Tiên, Bắt Đầu Cày Độ Thuần Thục Từ Ngư Nông","SeoDescription":"Trường Sinh Tu Tiên, Bắt Đầu Cày Độ Thuần Thục Từ Ngư Nông","Authors":[2302],"Speakers":[112270],"SubCategories":[450,493,435,434],"CategoryId":432,"ContentTitle":"Trường Sinh Tu Tiên, Bắt Đầu Cày Độ Thuần Thục Từ Ngư Nông","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"Xuyên qua tu tiên giới, trở thành một ngư nông cấp thấp trong phường thị Tinh Đảo Hồ. Linh căn kém cỏi, không có bối cảnh, đã lớn tuổi mà vẫn kẹt ở Luyện Khí tầng ba, bảng độ thuần thục trở thành chỗ dựa duy nhất của Giang Trường Sinh. Cày pháp thuật, cày kỹ năng, cày công pháp… Chỉ cần không ngừng cố gắng, ắt sẽ có thu hoạch. Năm tháng xoay vần, bãi bể hóa nương dâu. Bỗng nhiên ngoảnh đầu nhìn lại, Giang Trường Sinh đã trở thành truyền thuyết!","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F06\u002Ftruong-sinh-tu-tien-bat-dau-cay-do-thuan-thuc-tu-ngu-nong.jpg","ChapterCount":627,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2302","ContentTitle":"Khoái Nhạc Đích Bi Kịch","SeoUrl":"tac-gia-khoai-nhac-dich-bi-kich"}]},{"_id":"4328","Alias":"trong-sinh-1965-dat-con-len-nui-di-san-lam-giau","CreatedDate":"2026-04-17T17:51:58.136Z","ModifiedDate":"2026-07-02T18:09:40.102Z","SeoTitle":"Trọng Sinh 1965: Dắt Con Lên Núi Đi Săn Làm Giàu","SeoUrl":"trong-sinh-1965-dat-con-len-nui-di-san-lam-giau","SeoKeywords":"Trọng Sinh 1965: Dắt Con Lên Núi Đi Săn Làm Giàu","SeoDescription":"Trọng Sinh 1965: Dắt Con Lên Núi Đi Săn Làm Giàu","Authors":[1236],"Speakers":[112270],"SubCategories":[476,473,438,482,485],"CategoryId":432,"ContentTitle":"Trọng Sinh 1965: Dắt Con Lên Núi Đi Săn Làm Giàu","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"Mang theo rất nhiều tiếc nuối của kiếp trước, siêu cấp binh vương Trương Hoa Thành đã trọng sinh, trở về năm 1965, nơi bảo vật đầy rẫy khắp mặt đất.\nỞ cái thời đại không cấm súng, không cấm săn bắn, trong núi toàn là bảo vật, tài nguyên biển cả dồi dào này, Trương Hoa Thành lặng lẽ nâng khẩu súng săn trong tay lên.\nTừ đó, bên trong Trường Bạch Sơn gà bay chó sủa, sói xám bỏ trốn, mãnh hổ gầm gào, gấu nâu đi ngang qua cũng phải ăn một cước!\nMột lá thuyền con trôi nổi trên biển!\nỂ? Tàu săn cá voi của tiểu quỷ tử?\nAi cho phép tàu săn cá voi của các ngươi lái đến tận phòng khách nhà ta hả?\nTrả lời ta!","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F04\u002Ftrong-sinh-1965-dat-con-len-nui-di-san-lam-giau.jpg","ChapterCount":870,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"1236","ContentTitle":"Hoa Thành Liệt Diễm","SeoUrl":"tac-gia-hoa-thanh-liet-diem"}]},{"_id":"4671","Alias":"tieu-thu-tu-ban-theo-me-tai-gia-duoc-ke-huynh-cung-chieu-den-dien-cuong","CreatedDate":"2026-07-06T09:20:11.802Z","ModifiedDate":"2026-07-06T10:36:00.605Z","SeoTitle":"Tiểu Thư Tư Bản Theo Mẹ Tái Giá, Được Kế Huynh Cưng Chiều Đến Điên Cuồng","SeoUrl":"tieu-thu-tu-ban-theo-me-tai-gia-duoc-ke-huynh-cung-chieu-den-dien-cuong","SeoKeywords":"Tiểu Thư Tư Bản Theo Mẹ Tái Giá, Được Kế Huynh Cưng Chiều Đến Điên Cuồng","SeoDescription":"Tiểu Thư Tư Bản Theo Mẹ Tái Giá, Được Kế Huynh Cưng Chiều Đến Điên Cuồng","Authors":[2963],"Speakers":[112270],"SubCategories":[476,473,475,468,482,474,481,494],"CategoryId":432,"ContentTitle":"Tiểu Thư Tư Bản Theo Mẹ Tái Giá, Được Kế Huynh Cưng Chiều Đến Điên Cuồng","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"FULL","Note3":"","Note5":"","Note9":"","Recap":"【Song trọng sinh + thập niên 70 + không gian + đoàn sủng + ngược tra】\nThẩm gia bị tố cáo có quan hệ ở hải ngoại, đứng trước nguy cơ phải vào tù.\nThẩm Tư Nguyệt và tỷ tỷ ruột Thẩm Tư Âm đồng thời trọng sinh trở về đúng ngày này.\nKiếp trước, nàng theo phụ thân và các huynh trưởng bị đưa xuống nông thôn, còn tỷ tỷ ruột thì theo mẫu thân tái giá cho một trưởng quan quân khu.\nAi nấy đều nói, một tiểu thư tư bản yếu đuối bệnh tật như nàng sớm muộn cũng sẽ mục nát trong bùn đất.\nCòn tỷ tỷ thì bay lên cành cao, chắc chắn được hưởng vinh hoa cả đời.\nNhưng kết quả là...\nNàng dựa vào y thuật, sống vô cùng thuận lợi ở nông thôn.\nTỷ tỷ không được kế phụ và kế huynh yêu thích, ở Cố gia luôn phải dè dặt như đi trên băng mỏng.\nNàng gả cho trưởng tử của đội trưởng đội sản xuất, được trượng phu cùng phụ huynh hết lòng cưng chiều.\nTỷ tỷ lại gả cho một nam nhân tái hôn xấu xí, bạo lực gia đình, bị phản bội, còn bị hủy dung.\nNàng thi đỗ đại học, trở thành bác sĩ, mở y quán, thành lập công ty dược phẩm, cuối cùng trở thành một nữ doanh nhân danh tiếng.","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F07\u002Ftieu-thu-tu-ban-theo-me-tai-gia-duoc-ke-huynh-cung-chieu-den-dien-cuong-eaff7.jpg","ChapterCount":260,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2963","ContentTitle":"Tử Kim Dục","SeoUrl":"tac-gia-tu-kim-duc"}]},{"_id":"4472","Alias":"hoan-nghenh-quang-lam-nang-luc-thuong-diem","CreatedDate":"2026-05-23T07:27:17.646Z","ModifiedDate":"2026-07-11T04:06:08.096Z","SeoTitle":"Hoan Nghênh Quang Lâm Năng Lực Thương Điếm","SeoUrl":"hoan-nghenh-quang-lam-nang-luc-thuong-diem","SeoKeywords":"Hoan Nghênh Quang Lâm Năng Lực Thương Điếm","SeoDescription":"Hoan Nghênh Quang Lâm Năng Lực Thương Điếm","Authors":[2074],"Speakers":[112270],"SubCategories":[435,468,482,443,450,490,484],"CategoryId":432,"ContentTitle":"Hoan Nghênh Quang Lâm Năng Lực Thương Điếm","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"PLDfQYjqvu8IKOkKiImU9kD0VSeBapks8u","Note2":"NOT_FULL","Note3":"\u002Fuploads\u002Fbooks\u002F2026\u002F05\u002Fhoan-nghenh-quang-lam-nang-luc-thuong-diem-bg.jpg","Note5":"truyendocviet_-_hoan-nghenh-quang-lam-nang-luc-thuong-diem","Note9":"","Recap":"Vào năm hai mươi sáu tuổi, Trần Huyền tình cờ có được một cửa hàng vô cùng kỳ lạ.\nThế giới vốn dĩ quen thuộc bỗng chốc trở nên hoàn toàn khác biệt...\nTừ những nhân sĩ tu tiên, các vị danh nhân lịch sử, cho đến cả những phản khách (rebel\u002Fcyberpunk) của thế giới tương lai thảy đều trở thành khách hàng của hắn.\nTất cả chỉ bởi vì thứ mà cửa hàng này bày bán, chính là thứ mà bọn họ đang khát khao và cần kíp nhất:\n\"Năng lực\".","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F05\u002Fhoan-nghenh-quang-lam-nang-luc-thuong-diem.jpg","ChapterCount":402,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2074","ContentTitle":"Nhị Mục","SeoUrl":"tac-gia-nhi-muc"}]},{"_id":"4571","Alias":"trong-sinh-thap-nien-80-toi-nuoi-duong-nam-dai-lao","CreatedDate":"2026-06-15T17:29:04.899Z","ModifiedDate":"2026-06-15T18:01:15.240Z","SeoTitle":"Trọng Sinh Thập Niên 80: Tôi Nuôi Dưỡng Năm Đại Lão","SeoUrl":"trong-sinh-thap-nien-80-toi-nuoi-duong-nam-dai-lao","SeoKeywords":"Trọng Sinh Thập Niên 80: Tôi Nuôi Dưỡng Năm Đại Lão","SeoDescription":"Trọng Sinh Thập Niên 80: Tôi Nuôi Dưỡng Năm Đại Lão","Authors":[2507],"Speakers":[112270],"SubCategories":[476,473,438,450,490,482,437,475],"CategoryId":432,"ContentTitle":"Trọng Sinh Thập Niên 80: Tôi Nuôi Dưỡng Năm Đại Lão","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"FULL","Note3":"","Note5":"","Note9":"","Recap":"【Sách mới 《Tiên Gia Nông Trang Của Ta Chinh Phục Toàn Thế Giới》 cầu đặt trước, moah moah~】\nMột sớm xuyên qua, Tống Lan, nữ đặc công đứng đầu thế giới, mang theo siêu cấp thương thành trị giá trăm tỷ trọng sinh về thập niên sáu mươi, trở thành một kẻ buôn bán nhỏ lăn lộn nơi đầu đường xó chợ, còn phải dẫn theo năm đứa đệ muội do cha mẹ để lại, đói đến gầy trơ xương.\nNàng mạnh mẽ quật khởi, một đường lên như diều gặp gió, trở thành nữ đại lão giới thương nghiệp tiếng tăm lừng lẫy.\nNam chính: Diệp Tĩnh Viễn, thiên tài đại lão khoa học kỹ thuật, con trai duy nhất của nhà giàu nhất Cảng Thành. Hắn cùng nữ chính cường cường liên thủ, trừng ác dương thiện, kinh doanh làm giàu, nghiên cứu khoa học cường quốc, cùng bước lên đỉnh cao nhân sinh.\n【Nữ cường, siêu sảng, siêu ngọt, không ngược, không hiểu lầm, một với một, song C】\nGhi chú: Đã có tám tác phẩm hoàn thành, hoan nghênh các thân yêu dời bước đọc thử:\n《Trọng Sinh Năm Tám Mươi, Ta Thành Đại Lão Toàn Năng》\n《Không Gian Thần Y: Trọng Sinh Nữ Vương Mạnh Nhất》\n《Sủng Hôn Thiêu Đốt: Tức Phụ Quá Hung Hãn》\n《Khí Phụ Trọng Sinh Hào Môn: Thiên Kim Quật Khởi》\n《Sủng Hôn Liệt Ái: Siêu Năng Thiên Hậu Tập Kích》\n《Thần Y Hạ Đường Phi》\n《Kinh Thế Khí Hậu: Thần Y Tiểu Manh Bảo》\n《Hỏa Bạo Tiểu Y Nữ: Thiên Hạ Đệ Nhất Tuyệt Sủng》.","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F06\u002Ftrong-sinh-thap-nien-80-toi-nuoi-duong-nam-dai-lao-22f03.jpg","ChapterCount":411,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2507","ContentTitle":"Long Cửu Nguyệt","SeoUrl":"tac-gia-long-cuu-nguyet"}]},{"_id":"4313","Alias":"trong-sinh-roi-ta-khong-theo-duoi-nua-truc-ma-cao-lanh-khoc-cau-tai-hop","CreatedDate":"2026-04-15T03:46:48.604Z","ModifiedDate":"2026-04-15T04:06:58.413Z","SeoTitle":"Trọng Sinh Rồi, Ta Không Theo Đuổi Nữa! Trúc Mã Cao Lãnh Khóc Cầu Tái Hợp","SeoUrl":"trong-sinh-roi-ta-khong-theo-duoi-nua-truc-ma-cao-lanh-khoc-cau-tai-hop","SeoKeywords":"Trọng Sinh Rồi, Ta Không Theo Đuổi Nữa! Trúc Mã Cao Lãnh Khóc Cầu Tái Hợp","SeoDescription":"Trọng Sinh Rồi, Ta Không Theo Đuổi Nữa! Trúc Mã Cao Lãnh Khóc Cầu Tái Hợp","Authors":[1161],"Speakers":[112270],"SubCategories":[437,475,438,478,473,476],"CategoryId":432,"ContentTitle":"Trọng Sinh Rồi, Ta Không Theo Đuổi Nữa! Trúc Mã Cao Lãnh Khóc Cầu Tái Hợp","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"【Trúc mã cao lãnh hóa điên phê + truy thê hỏa táng tràng + song khiết + thanh mai trúc mã】\n【Trúc mã cao lãnh mắc bệnh thiên tài ✖️ tiểu công chúa xinh đẹp rạng rỡ giả ôn nhu mềm mại】\nAi ai cũng biết, Trì Tuyết đã thích Lê Tẫn suốt hai mươi năm.\nTừ khi còn bé xíu đã chạy theo sau lưng hắn.\nTheo đuổi đến năm mười tám tuổi, lén hôn hắn một cái, lại bị hắn thẳng tay đẩy ra.\nTheo đuổi đến năm hai mươi tư tuổi, dựa vào một bữa tiệc rượu đã sắp đặt từ lâu, biến gạo sống thành cơm chín.\n—\nNgười Lê gia cảm thấy cô nương này quá nhiều tâm cơ, Lê Tẫn không nói một lời.\nNgười Trì gia lại thấy con gái mình quá mất giá, nhưng Trì Tuyết nhất quyết đòi gả.\nSau khi kết hôn ba năm, bọn họ sống trong cùng một căn nhà, ngủ trên cùng một chiếc giường, vậy mà lại giống như hai người xa lạ thuê chung.\nHắn chưa từng chạm vào nàng, cũng chưa từng nói yêu nàng.\nTrưởng bối Lê gia thúc giục chuyện sinh con đến mức gấp gáp, lời nói cũng ngày một khó nghe:\n“Giữ không nổi trái tim nam nhân, đến cả một đứa con cũng không mang thai được, cũng chẳng biết năm đó mấy thủ đoạn kia rốt cuộc có ích lợi gì.”\n—\nNgày hai mươi chín tháng Chạp, đế đô tuyết lớn.\nTrì Tuyết đốt sạch toàn bộ thư tình từng viết cho Lê Tẫn, uống nửa lọ thuốc ngủ rồi nằm thiếp đi trên giường.\nTrước khi chìm vào giấc ngủ, nàng nghĩ: “Nếu không tỉnh lại nữa, cứ xem như thế giới này buông tha cho ta.”\nQuả thật nàng không bao giờ tỉnh lại nữa.\nĐến khi mở mắt lần nữa, nàng quay về năm hai mươi tư tuổi. Lần này, nàng không theo đuổi hắn nữa.\nĐêm tuyết, trong căn phòng không bật đèn.\nNàng lại bị nam nhân giữ chặt vòng eo mảnh mai, ép vào góc tường, hôn đến gần như ngạt thở.\nLê Tẫn đỏ hoe mắt, cắn nhẹ vành tai nàng, giọng khàn đặc.\n“Ngươi nói không theo đuổi là không theo đuổi thật sao? Vì sao lại không cần ta nữa?”","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F04\u002Ftrong-sinh-roi-ta-khong-theo-duoi-nua-truc-ma-cao-lanh-khoc-cau-tai-hop.jpg","ChapterCount":81,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"1161","ContentTitle":"Bất Hát Lương Bạch Khai Đích Miêu","SeoUrl":"tac-gia-bat-hat-luong-bach-khai-dich-mieu"}]},{"_id":"4536","Alias":"pham-tran-phi-tien","CreatedDate":"2026-06-09T15:02:57.967Z","ModifiedDate":"2026-06-25T17:29:47.029Z","SeoTitle":"Phàm Trần Phi Tiên","SeoUrl":"pham-tran-phi-tien","SeoKeywords":"Phàm Trần Phi Tiên","SeoDescription":"Phàm Trần Phi Tiên","Authors":[2355],"Speakers":[112270],"SubCategories":[435,434,483],"CategoryId":432,"ContentTitle":"Phàm Trần Phi Tiên","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"Một thiếu niên thôn quê tầm thường, giữa chốn nhân gian bình lặng, bất ngờ chạm tay vào vận mệnh xoay chuyển càn khôn. Tình cờ sở hữu một chiếc chậu thần bí với khả năng sao chép vạn vật, hắn từ một kẻ vô danh tiểu tốt bỗng chốc nắm giữ nguồn tài nguyên tu luyện vô tận. Từ đây, con đường tu tiên đầy rẫy chông gai chính thức mở ra trước mắt. Tiên lộ mịt mùng, liệu thiếu niên ấy có thể nghịch thiên cải mệnh, bước lên đỉnh cao của tiên giới?","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F06\u002Fpham-tran-phi-tien.jpg","ChapterCount":2380,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2355","ContentTitle":"Tề Giáp","SeoUrl":"tac-gia-te-giap"}]},{"_id":"4309","Alias":"quan-truong-si-do-tu-ban-guc-toi-pham-bat-dau","CreatedDate":"2026-04-14T16:55:41.245Z","ModifiedDate":"2026-04-14T23:57:06.219Z","SeoTitle":"Quan Trường: Sĩ Đồ Từ Bắn Gục Tội Phạm Bắt Đầu","SeoUrl":"quan-truong-si-do-tu-ban-guc-toi-pham-bat-dau","SeoKeywords":"Quan Trường: Sĩ Đồ Từ Bắn Gục Tội Phạm Bắt Đầu","SeoDescription":"Quan Trường: Sĩ Đồ Từ Bắn Gục Tội Phạm Bắt Đầu","Authors":[1144],"Speakers":[112270],"SubCategories":[438,453,473,476,478],"CategoryId":432,"ContentTitle":"Quan Trường: Sĩ Đồ Từ Bắn Gục Tội Phạm Bắt Đầu","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"FULL","Note3":"","Note5":"","Note9":"","Recap":"Nhân vật chính: Dương Tiêu\nDương Tiêu được ban cho cơ hội sống lại trùng sinh một lần nữa trở về năm 2003, ngay lập tức trùng phùng với cái ngày định mệnh đã từng xoay chuyển hoàn toàn quỹ đạo cuộc đời của hắn ở kiếp trước. Lần sống lại này, hắn vô cùng quả quyết mạnh mẽ quyết đoán không hề do dự mà lập tức siết chặt bóp cò súng tiến hành cướp cò, nháy mắt chuẩn xác hạ bệ đánh gục tên hãn phỉ tàn bạo đang uy hiếp đứng lù lù ngay ở phía đằng trước, từ đó đường hoàng bắt đầu đặt chân dấn thân trải nghiệm con đường quan lộ đầy thăng trầm và mưu kế ở chốn quan trường nhân sinh.\nXuất phát điểm chỉ là một chàng dân cảnh vô danh của sở cảnh sát tại tầng thấp cơ sở, Dương Tiêu hoàn toàn dựa vào kho tàng ký ức sâu sắc rõ mồn một của chính kiếp sống trước kia hòng liên tục vạch trần hàng loạt những mảng tối kinh hoàng lập công phá dỡ vô vàn chuyên án trọng yếu khó nhằn. Trải qua những trận thử lửa kinh thiên động địa lập xuống không biết bao nhiêu thành tựu vang dội xuất sắc, đem tiền đồ huy hoàng trải hoa bằng gấm.\nVững bước tiến lấn ở giữa nơi chốn quan trường vây quanh dày đặc bởi muôn trùng những mưu kế thâm sâu khó lường dường như điên đảo sóng cuộn, Dương Tiêu ở mọi khoảnh khắc từ trước tới nay đều luôn luôn cắn răng bất di bất dịch kiên định nỗ lực không dời gìn giữ bảo vệ cẩn trọng lấy ánh sáng chính nghĩa thắp cháy bùng lên sưởi ấm tận tận đáy lòng. Vững chãi đạp chân bước từng bước một tựa núi dời sừng sững dốc sức thăng tiến đoạt đỉnh xông pha trèo lên đạt được đến chiếc ngai vàng độc tôn đầy uy quyền chói lọi nằm ngay vị trí chóp bu tối thượng vĩ đại tột cùng!","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F04\u002Fquan-truong-si-do-tu-ban-guc-toi-pham-bat-dau.jpg","ChapterCount":814,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"1144","ContentTitle":"Cát Mộc Sinh Hoa","SeoUrl":"tac-gia-cat-moc-sinh-hoa"}]},{"_id":"4577","Alias":"trong-vong-10-met-quanh-ta-toan-bo-deu-phi-thang","CreatedDate":"2026-06-16T11:56:06.767Z","ModifiedDate":"2026-06-16T12:21:00.984Z","SeoTitle":"Trong Vòng 10 Mét Quanh Ta, Toàn Bộ Đều Phi Thăng","SeoUrl":"trong-vong-10-met-quanh-ta-toan-bo-deu-phi-thang","SeoKeywords":"Trong Vòng 10 Mét Quanh Ta, Toàn Bộ Đều Phi Thăng","SeoDescription":"Trong Vòng 10 Mét Quanh Ta, Toàn Bộ Đều Phi Thăng","Authors":[206606],"Speakers":[112270],"SubCategories":[450,475,435,434,446,490,470],"CategoryId":432,"ContentTitle":"Trong Vòng 10 Mét Quanh Ta, Toàn Bộ Đều Phi Thăng","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"FULL","Note3":"","Note5":"","Note9":"","Recap":"Vân Vãn xuyên không thành nữ phụ ác độc trong một bộ sảng văn nam tần.\nNữ phụ xuất thân từ Hợp Hoan Tông, mang thể chất cực phẩm khó có thể miêu tả. Lấy nàng làm trung tâm, tu sĩ trong phạm vi mười mét đều có thể dựa vào nàng để tăng tu vi. Nói nàng là linh tuyền di động cũng chẳng quá lời. Nếu hai bên song tu, tại chỗ thành tiên cũng không phải là chuyện không thể.\nVì vậy, phụ quân đã xem nàng như “lễ vật”, dâng cho nam phụ xui xẻo số N trong truyện là Tuế Uyên. Không ngờ, đối phương lại trả hàng ngay tại chỗ.\nKhi Vân Vãn xuyên qua, vừa hay đang trên đường bị đem đi “tặng lễ”.\nNghĩ đến kết cục thê thảm của nữ phụ, Vân Vãn quyết định bỏ trốn, tìm một tông môn bái sư học nghệ. Vì bảo đảm an toàn, nàng còn chuẩn bị tìm thêm một hộ vệ.\nHộ vệ mà nàng nhìn trúng mặc áo đen thanh nhã, khí chất sạch bụi, dung mạo bất phàm. Vân Vãn vui vẻ tiến lại gần:\n“Huynh đệ, nhận đơn không? Chỉ cần ngươi ở trong phạm vi mười mét quanh ta, mỗi giây có thể nhận được tám trăm tám mươi tám điểm tu vi.”\nCuối cùng nàng còn bổ sung một câu:\n“Sự thành rồi, chúng ta thần hồn giao hòa, cùng nhau phi thăng.”\nKhông sai, nàng thèm cơ bụng của người ta.\nChỉ với ba câu, Vân Vãn đã thành công khiến mỹ nam hộ tống nàng suốt tám mươi tám ngày.\nCuối cùng cũng đến được đại tông môn, Vân Vãn đang định vẫy tay từ biệt hộ vệ, thì nghênh đón nàng lại là một câu:\n“Cung nghênh Tuế Uyên sư tôn, Vân Vãn sư mẫu hồi tông!”\n“……???”\nTuế cái gì Uyên?\nSư cái gì mẫu?\nĐối phương nhìn nàng như cười như không:\n“Thần hồn giao hòa, cùng nhau phi thăng?”\n“……”\nKhốn kiếp, hóa ra nàng mới là kẻ xui xẻo nhỏ bé kia.\nTrọng điểm: Trong truyện có thiết lập riêng, xin đừng khảo cứu. Nhân vật phụ có tốt có xấu, không thể viết toàn bộ nữ phụ đều là người tốt. Bất kể nam nữ đều sẽ có chính diện và phản diện.\nCấp bậc tu tiên gồm: Luyện Khí, Trúc Cơ, Khai Quang, Kim Đan, Nguyên Anh, Đại Thừa, Độ Kiếp.\nNhãn nội dung: Tiên hiệp tu chân, xuyên sách.\nTừ khóa tìm kiếm: Nhân vật chính: Vân Vãn, Tạ Thính Vân. Nhân vật phụ: Khác.\nMột câu giới thiệu: Nữ phụ Hợp Hoan Tông tuyệt đối không nhận thua!\nLập ý: Tu tiên khoa học, cường thân kiện thể.\nĐánh giá tác phẩm:\nVân Vãn xuyên không thành nữ phụ ác độc trong một bộ sảng văn nam tần. Nữ phụ xuất thân từ Hợp Hoan Tông, thể chất đặc biệt, lấy nàng làm trung tâm, tu sĩ trong phạm vi mười mét đều có thể dựa vào nàng để tăng tu vi. Vì vậy, phụ quân đã xem nàng như “lễ vật”, dâng cho nam phụ xui xẻo số N trong truyện là Tuế Uyên. Để thay đổi kết cục, sau khi xuyên không, Vân Vãn lập tức bỏ trốn khỏi hôn sự, còn đặc biệt tìm một hộ vệ. Không ngờ hộ vệ ấy lại chính là Tuế Uyên trong truyền thuyết. Truyện chủ yếu kể về những chuyện thú vị xảy ra trên đường giữa Vân Vãn và nam chính Tuế Uyên. Hành văn nhẹ nhàng hài hước, lối kể chuyện giản dị mà thú vị, tình tiết chặt chẽ đặc sắc.","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F06\u002Ftrong-vong-10-met-quanh-ta-toan-bo-deu-phi-thang-cce0f.jpg","ChapterCount":331,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"206606","ContentTitle":" Cẩm Chanh","SeoUrl":"cam-chanh"}]},{"_id":"4466","Alias":"hanh-lam-canh-do","CreatedDate":"2026-05-21T18:48:28.792Z","ModifiedDate":"2026-05-21T18:58:37.763Z","SeoTitle":"Hạnh Lâm Cảnh Đồ","SeoUrl":"hanh-lam-canh-do","SeoKeywords":"Hạnh Lâm Cảnh Đồ","SeoDescription":"Hạnh Lâm Cảnh Đồ","Authors":[2047],"Speakers":[112270],"SubCategories":[438,473,476,478,439],"CategoryId":432,"ContentTitle":"Hạnh Lâm Cảnh Đồ","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"Trọng sinh quá khứ, vạch trần tương lai, mộng ảo hiện thực, đắp nặn lại nhân sinh truyền kỳ!\nGia truyền đã mấy đời làm Đông y, thế nhưng đến đời của Cố Hành, dưới sự đưa đẩy của đủ thứ xui xẻo oái oăm (âm sai dương thác), hắn lại đành phải dấn thân lên con đường làm cảnh sát.\nSát ngôn quan sắc (nhìn thấu vẻ mặt nghe lời phân tích), văn thanh biện tức (nghe âm thanh phân biệt hơi thở), truy căn cứu để (truy nguyên đào rễ), chỉ hạ tầm chân (tìm kiếm chân lý dưới đầu ngón tay), đây chính là một tay sinh viên trường Y vừa mới tốt nghiệp tuy chỉ hiểu biết đôi chút về \"vọng văn vấn thiết\" (nhìn, nghe, hỏi, bắt mạch) nhưng lại phải làm một công việc hoàn toàn trái ngành trái nghề.\n\"Đội trưởng Đổng, ngài nói trên thẻ căn cước của người này hoàn toàn không có vấn đề gì phải không?\nTại sao tôi lại nhìn ra được cái gã này hiện đang tỳ vị hư nhược, tâm thần thất thủ, rêu lưỡi dày đặc nhớp nháp, hơn nữa lại còn hao tổn tân dịch nghiêm trọng đến như thế này chứ?\nTrạng thái này quả thực rất giống với phản ứng của đám tội phạm gây án đang phải lẩn trốn chạy trối chết!\"","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F05\u002Fhanh-lam-canh-do.jpg","ChapterCount":83,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2047","ContentTitle":"Phụng Nghĩa Thiên Nhai","SeoUrl":"tac-gia-phung-nghia-thien-nhai"}]},{"_id":"4535","Alias":"xuyen-thanh-tien-nhi-dai-bi-nu-de-dien-phe-cuop-hon","CreatedDate":"2026-06-09T11:52:32.057Z","ModifiedDate":"2026-06-09T12:08:26.510Z","SeoTitle":"Xuyên Thành Tiên Nhị Đại, Bị Nữ Đế Điên Phê Cướp Hôn","SeoUrl":"xuyen-thanh-tien-nhi-dai-bi-nu-de-dien-phe-cuop-hon","SeoKeywords":"Xuyên Thành Tiên Nhị Đại, Bị Nữ Đế Điên Phê Cướp Hôn","SeoDescription":"Xuyên Thành Tiên Nhị Đại, Bị Nữ Đế Điên Phê Cướp Hôn","Authors":[2354],"Speakers":[112270],"SubCategories":[450,490,470,435,434],"CategoryId":432,"ContentTitle":"Xuyên Thành Tiên Nhị Đại, Bị Nữ Đế Điên Phê Cướp Hôn","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"Nhân vật chính: Tô Lân\nTô Lân thân là tiên nhị đại, vốn chỉ muốn nằm yên hưởng thụ tất cả, nào ngờ còn đang ở cái tuổi bú sữa đã bị nữ đế cướp hôn, bị ép hạ phàm.\nĐường đường là tiên nhị đại, vừa mở đầu đã phải lưu lạc, chuyện quái quỷ này biết tìm ai nói lý đây?\nThánh nữ Hồ tộc, tiên tử Tiên giới, yêu nữ Ma giới, từng người cứ như thiêu thân lao vào lửa mà ập tới, Tô Lân đều nhìn thấu từng người một.\n“Tiên tử, ta là người đứng đắn, chuyên làm việc chính nghĩa. Mấy chuyện đẩy sóng trợ gió này, ngươi tìm người khác đi.”\n“Thánh nữ, chúng ta mới quen biết ngày đầu tiên, ngươi đã chuốc say ta rồi bắt về phòng, thế mà có thể là chân ái sao? Đó là thèm thân thể ta, ngươi hạ tiện!”\n“Muội muội yêu hồ, xin đừng yêu ta!”\nTô Lân đi qua vạn bụi hoa, một phiến lá cũng không dính vào người.\nTu tiên giới sáo lộ quá sâu, ta muốn về quê!","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F06\u002Fxuyen-thanh-tien-nhi-dai-bi-nu-de-dien-phe-cuop-hon.jpg","ChapterCount":98,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2354","ContentTitle":"Bách Vạn Đan Cơ Vương","SeoUrl":"tac-gia-bach-van-dan-co-vuong"}]},{"_id":"4460","Alias":"nhat-nhan-chi-ha-ta-ten-la-ue-nguyen-chan-quan","CreatedDate":"2026-05-21T10:41:07.889Z","ModifiedDate":"2026-05-21T10:50:56.389Z","SeoTitle":"Nhất Nhân Chi Hạ: Ta tên là Uế Nguyên Chân Quân","SeoUrl":"nhat-nhan-chi-ha-ta-ten-la-ue-nguyen-chan-quan","SeoKeywords":"Nhất Nhân Chi Hạ: Ta tên là Uế Nguyên Chân Quân","SeoDescription":"Nhất Nhân Chi Hạ: Ta tên là Uế Nguyên Chân Quân","Authors":[2037],"Speakers":[112270],"SubCategories":[435,434,483],"CategoryId":432,"ContentTitle":"Nhất Nhân Chi Hạ: Ta tên là Uế Nguyên Chân Quân","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"NOT_FULL","Note3":"","Note5":"","Note9":"","Recap":"Chư thiên lưu!\nMuốn biết công pháp Tạo Hóa Uế Nguyên, phải xem Chư Thiên Độ Ách Truyện!\nTrong 《Trang Tử  Tri Bắc Du》 có ghi:\nĐông Quách Tử hỏi Trang Tử: “Cái gọi là Đạo, rốt cuộc ở nơi nào?”\nTrang Tử đáp: “Không nơi nào là không có.”\nĐông Quách Tử nói: “Xin nói rõ một nơi rồi sau mới có thể hiểu được.”\nTrang Tử nói: “Ở trong loài kiến nhỏ.”\nĐông Quách Tử nói: “Sao lại thấp hèn đến thế?”\nTrang Tử nói: “Ở trong cỏ dại.”\nĐông Quách Tử nói: “Sao lại càng thấp hơn nữa?”\nTrang Tử nói: “Ở trong gạch ngói.”\nĐông Quách Tử nói: “Sao lại càng quá đáng hơn nữa?”\nTrang Tử nói: “Ở trong…”\nChu Nguyên từ truyền thừa của hạ cửu lưu mà đắc đạo.\nTa có một thuật, có thể gọt bỏ tam hoa, phong bế ngũ khí, lại có công hiệu Tạo Hóa Uế Nguyên, độ ách tiêu nghiệp!","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F05\u002Fnhat-nhan-chi-ha-ta-ten-la-ue-nguyen-chan-quan.jpg","ChapterCount":95,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"2037","ContentTitle":"Thượng Thanh Ngọc Cảnh Đạo Quân","SeoUrl":"tac-gia-thuong-thanh-ngoc-canh-dao-quan"}]},{"_id":"4410","Alias":"trong-sinh-chi-tai-nguyen-con-con","CreatedDate":"2026-05-09T18:44:07.455Z","ModifiedDate":"2026-05-10T04:20:30.810Z","SeoTitle":"Trọng Sinh Chi Tài Nguyên Cổn Cổn","SeoUrl":"trong-sinh-chi-tai-nguyen-con-con","SeoKeywords":"Trọng Sinh Chi Tài Nguyên Cổn Cổn","SeoDescription":"Trọng Sinh Chi Tài Nguyên Cổn Cổn","Authors":[159540],"Speakers":[112270],"SubCategories":[438,478,476,473,485],"CategoryId":432,"ContentTitle":"Trọng Sinh Chi Tài Nguyên Cổn Cổn","DataType":"book","Identifier_Video":null,"IsActive":true,"IsVip":true,"CopyFrom":"","Note1":"","Note2":"FULL","Note3":"","Note5":"","Note9":"","Recap":"Khi trọng sinh đã trở thành một trào lưu, Lý Đông cũng may mắn đuổi kịp được chuyến xe ngựa trọng sinh này.\nKiếp trước có quá nhiều tiếc nuối, kiếp này hãy để cho hắn bù đắp lại từng điều một!\nCùng xem một kẻ tiểu nhân vật quay trở về năm 2004, tình thân và tình yêu đều nghênh đón vụ mùa bội thu, làm giàu phát tài cùng một lúc trọn vẹn cả đôi đường!","Thumbnail":"\u002Fuploads\u002Fbooks\u002F2026\u002F05\u002Ftrong-sinh-chi-tai-nguyen-con-con.jpg","ChapterCount":1721,"VideoCount":0,"DocumentCount":0,"SortBy":"ContentOrder__ASC","videos":0,"ListAuthors":[{"_id":"159540","ContentTitle":"Lão Ưng Cật Tiểu Kê","SeoUrl":"lao-ung-cat-tieu-ke"}]}],"arrChapters":[{"_id":"2134690","Alias":"thai-co-than-ton_-_chapter_-_chuong-101-thanh-chu-chung-vo-dao_-_index_-_101","CreatedDate":"2025-03-09T10:26:04.322Z","IsActive":true,"ContentTitle":"Chương 101: Thành chủ Chung Vô Đạo","ContentOrder":101,"Note1":"","Note7":""},{"_id":"2134692","Alias":"thai-co-than-ton_-_chapter_-_chuong-102-khong-con-dam-khinh-thi_-_index_-_102","CreatedDate":"2025-03-09T10:26:04.994Z","IsActive":true,"ContentTitle":"Chương 102: Không còn dám khinh thị
