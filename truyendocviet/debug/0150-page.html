on our Website. We may or may not post notices on the homepage of our Website when such changes occur.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ENgười D&ugrave;ng\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EY&ecirc;u cầu về độ tuổi\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EWebsite truyendocviet chỉ d&agrave;nh cho những người từ 13 tuổi trở l&ecirc;n. Nếu ch&uacute;ng t&ocirc;i biết ai đ&oacute; dưới 13 tuổi đang sử dụng website truyendocviet, ch&uacute;ng t&ocirc;i sẽ chấm dứt t&agrave;i khoản của họ.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EMột v&agrave;i truyện c&oacute; nội dung, h&igrave;nh ảnh d&agrave;nh cho người trưởng th&agrave;nh, đảm bảo bạn tr&ecirc;n 18 tuổi để tiếp tục đọc những t&aacute;c phẩm đ&oacute;. Vui l&ograve;ng y&ecirc;u cầu cha mẹ hoặc người gi&aacute;m hộ hợp ph&aacute;p c&ugrave;ng bạn đọc c&aacute;c điều khoản n&agrave;y.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ENếu bạn l&agrave; cha mẹ hoặc người gi&aacute;m hộ hợp ph&aacute;p v&agrave; bạn cho ph&eacute;p con bạn sử dụng c&aacute;c dịch vụ n&agrave;y, th&igrave; bạn phải tu&acirc;n theo c&aacute;c điều khoản n&agrave;y v&agrave; chịu tr&aacute;ch nhiệm đối với hoạt động của con bạn trong c&aacute;c dịch vụ đ&oacute;.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EMột số truyện sẽ c&oacute; c&aacute;c y&ecirc;u cầu bổ sung về độ tuổi như m&ocirc; tả tr&ecirc;n từng bộ truyện.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EB&igrave;nh luận\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EB&igrave;nh luận truyện l&agrave; chế độ mở d&agrave;nh cho tất cả người d&ugrave;ng đăng nhập v&agrave; người d&ugrave;ng ẩn danh, ch&uacute;ng t&ocirc;i lưu trữ IP tr&ecirc;n từng b&igrave;nh luận.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EMọi b&igrave;nh luận kh&ocirc;ng được c&oacute; nội dung về ch&iacute;nh trị, t&ocirc;n gi&aacute;o cũng như đả k&iacute;ch, x&uacute;c phạm, b&ocirc;i nhọ danh dự đến người kh&aacute;c v&agrave; phải tu&acirc;n thủ theo ph&aacute;p luật Việt Nam quy định.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ETh&agrave;nh Vi&ecirc;n\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EBạn chịu tr&aacute;ch nhiệm cho tất cả hoạt động tr&ecirc;n t&agrave;i khoản của m&igrave;nh v&agrave; giữ b&iacute; mật mật khẩu của bạn. Nếu bạn chia sẻ th&ocirc;ng tin t&agrave;i khoản của m&igrave;nh với bất kỳ ai, người đ&oacute; c&oacute; thể kiểm so&aacute;t được t&agrave;i khoản v&agrave; ch&uacute;ng t&ocirc;i kh&ocirc;ng thể x&aacute;c định ai l&agrave; chủ t&agrave;i khoản th&iacute;ch hợp. Ch&uacute;ng t&ocirc;i sẽ kh&ocirc;ng c&oacute; bất kỳ tr&aacute;ch nhiệm ph&aacute;p l&yacute; n&agrave;o đối với bạn (hoặc bất kỳ ai m&agrave; bạn chia sẻ th&ocirc;ng tin t&agrave;i khoản của m&igrave;nh) do h&agrave;nh động của bạn hoặc của họ trong những trường hợp đ&oacute;. Nếu bạn ph&aacute;t hiện ra rằng ai đ&oacute; đ&atilde; sử dụng t&agrave;i khoản của bạn m&agrave; kh&ocirc;ng c&oacute; sự cho ph&eacute;p của bạn, bạn n&ecirc;n b&aacute;o c&aacute;o tại truyendocviet@gmail.com.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ENội Dung\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EKhi bạn đăng nội dung l&ecirc;n truyendocviet, ch&uacute;ng t&ocirc;i cần sự cho ph&eacute;p hợp ph&aacute;p theo luật bản quyền hiện h&agrave;nh để hiển thị nội dung đ&oacute; cho người d&ugrave;ng. Về mặt ph&aacute;p l&yacute;, điều n&agrave;y c&oacute; nghĩa l&agrave; bạn cấp cho ch&uacute;ng t&ocirc;i giấy ph&eacute;p kh&ocirc;ng độc quyền để xuất bản nội dung của bạn tr&ecirc;n truyendocviet.vn, bao gồm bất kỳ thứ g&igrave; li&ecirc;n quan hợp l&yacute; đến việc xuất bản nội dung đ&oacute; (như lưu trữ, hiển thị, định dạng lại v&agrave; ph&acirc;n phối nội dung đ&oacute;). Bạn sẽ cần quyết định c&aacute;ch bạn muốn cấp ph&eacute;p nội dung c&acirc;u chuyện của m&igrave;nh cho cộng đồng truyendocviet. Vui l&ograve;ng đọc về vấn đ&egrave; Bản quyền để được hỗ trợ trong việc đưa ra quyết định n&agrave;y.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EVề bản quyền c&aacute;c t&aacute;c phẩm dịch thuật\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E1. Đ&acirc;y l&agrave; một nền tảng mở, mọi th&agrave;nh vi&ecirc;n c&oacute; quyền đăng truyện do m&igrave;nh từ dịch từ c&aacute;c ng&ocirc;n ngữ kh&aacute;c.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E2. Ch&uacute;ng t&ocirc;i kh&ocirc;ng chịu tr&aacute;ch nhiệm về bản quyền nếu c&oacute; khiếu kiện xảy ra.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E3. Ch&uacute;ng t&ocirc;i sẽ sử dụng mọi biện ph&aacute;p về c&ocirc;ng nghệ như gỡ bỏ, cấm IP đối với c&aacute;c t&aacute;c phẩm c&oacute; vấn đề với bản quyền hoặc được t&aacute;c giả gốc y&ecirc;u cầu.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E4. Ch&uacute;ng t&ocirc;i kh&ocirc;ng đại diện cho nh&oacute;m dịch, người dịch l&agrave; th&agrave;nh vi&ecirc;n.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E5. Ch&uacute;ng t&ocirc;i kh&ocirc;ng c&oacute; tr&aacute;ch nhiệm truy cứu, kiện tụng v&agrave; ph&acirc;n giải đối với c&aacute;c t&aacute;c phẩm kh&ocirc;ng do truyendocviet sở hữu bản quyền.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EVề ph&iacute;a ch&uacute;ng t&ocirc;i\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003Etruyendocviet c&oacute; thể thay đổi, chấm dứt hoặc hạn chế quyền truy cập v&agrave;o bất kỳ kh&iacute;a cạnh n&agrave;o của Dịch vụ bất kỳ l&uacute;c n&agrave;o m&agrave; kh&ocirc;ng cần th&ocirc;ng b&aacute;o. Ch&uacute;ng t&ocirc;i c&oacute; thể x&oacute;a bất kỳ nội dung n&agrave;o bạn đăng hoặc gửi v&igrave; bất kỳ l&yacute; do g&igrave;. truyendocviet c&oacute; thể truy cập, đọc, lưu giữ v&agrave; tiết lộ bất kỳ th&ocirc;ng tin n&agrave;o m&agrave; ch&uacute;ng t&ocirc;i tin rằng cần thiết một c&aacute;ch hợp l&yacute; để đ&aacute;p ứng bất kỳ luật, quy định, quy tr&igrave;nh ph&aacute;p l&yacute; hiện h&agrave;nh n&agrave;o hoặc y&ecirc;u cầu của ch&iacute;nh phủ, thực thi Điều khoản dịch vụ, bao gồm cả việc điều tra c&aacute;c vi phạm tiềm ẩn, ph&aacute;t hiện, ngăn chặn hoặc giải quyết c&aacute;c vấn đề gian lận, bảo mật hoặc kỹ thuật, phản hồi c&aacute;c y&ecirc;u cầu hỗ trợ của người d&ugrave;ng hoặc bảo vệ quyền, t&agrave;i sản hoặc sự an to&agrave;n của Dịch vụ, người d&ugrave;ng v&agrave; c&ocirc;ng ch&uacute;ng.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EQuảng C&aacute;o\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ECh&uacute;ng t&ocirc;i cung cấp Dịch vụ miễn ph&iacute;. Để c&oacute; thể tiếp tục l&agrave;m như vậy, ch&uacute;ng t&ocirc;i hiển thị c&aacute;c quảng c&aacute;o v&agrave; khuyến m&atilde;i của b&ecirc;n thứ ba tr&ecirc;n hoặc li&ecirc;n quan đến Dịch vụ. V&igrave; quảng c&aacute;o m&agrave; ch&uacute;ng t&ocirc;i cung cấp dựa tr&ecirc;n th&ocirc;ng tin do b&ecirc;n thứ ba cung cấp, ch&uacute;ng t&ocirc;i sẽ kh&ocirc;ng chịu tr&aacute;ch nhiệm hoặc c&oacute; nghĩa vụ đối với bất kỳ tổn thất hoặc thiệt hại n&agrave;o do bạn ph&aacute;t sinh do bất kỳ quảng c&aacute;o n&agrave;o. Tương t&aacute;c của bạn với c&aacute;c nh&agrave; quảng c&aacute;o được t&igrave;m thấy tr&ecirc;n hoặc th&ocirc;ng qua Dịch vụ, bao gồm nhưng kh&ocirc;ng giới hạn, tất cả đều phụ thuộc v&agrave;o quảng c&aacute;o, tất cả c&aacute;c giao dịch thương mại v&agrave; nghĩa vụ ph&aacute;p l&yacute; li&ecirc;n quan đến c&aacute;c quảng c&aacute;o đ&oacute;, chỉ l&agrave; giữa bạn v&agrave; c&aacute;c nh&agrave; quảng c&aacute;o.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ECookies\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EWebsite đang sử dụng cookie để cung cấp trải nghiệm người d&ugrave;ng tốt hơn, thu thập ph&acirc;n t&iacute;ch kh&aacute;ch truy cập ẩn danh v&agrave; hiển thị quảng c&aacute;o được c&aacute; nh&acirc;n h&oacute;a. Đ&acirc;y l&agrave; c&aacute;c tệp tr&igrave;nh duyệt nhỏ v&agrave; bạn c&oacute; thể v&ocirc; hiệu h&oacute;a v&agrave; x&oacute;a ch&uacute;ng trong c&agrave;i đặt tr&igrave;nh duyệt của m&igrave;nh hoặc theo d&otilde;i ch&uacute;ng bằng plugin Web Developer của Google Chorme . Ch&uacute;ng t&ocirc;i hiển thị cảnh b&aacute;o về việc sử dụng cookie cho kh&aacute;ch truy cập Ch&acirc;u &Acirc;u theo luật GDPR.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ECh&uacute;ng t&ocirc;i chủ yếu sử dụng cookie của b&ecirc;n thứ ba như Google Analytics để theo d&otilde;i hoạt động của kh&aacute;ch truy cập, Google AdSense để hiển thị quảng c&aacute;o được c&aacute; nh&acirc;n h&oacute;a. Vui l&ograve;ng tham khảo ch&iacute;nh s&aacute;ch bảo mật của họ để t&igrave;m hiểu th&ecirc;m. Cookie của b&ecirc;n thứ nhất duy nhất m&agrave; ch&uacute;ng t&ocirc;i sử dụng l&agrave; để theo d&otilde;i sự đồng &yacute; của du kh&aacute;ch Ch&acirc;u &Acirc;u đối với việc ch&uacute;ng t&ocirc;i sử dụng cookie.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EThis website is using cookies to provide a better user experience, to collect anonymous visitor analytics and to show personalized ads. These are small browser files and you can disable and erase them in your browser settings or track them with Google Chorme's Web Developer plugin. We show warnings about the use of cookies to European visitors according to the GDPR law.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EWe use mostly third party cookies such as Google Analytics to track visitor activity, Google AdSense to show personalized ads. Please consult their privacy policies to learn more. The only first-party cookie we use is to track the consent of European visitors for our use of cookies.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EDMCA Compliance\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ENếu bạn c&oacute; ph&agrave;n n&agrave;n g&igrave; về nội dung hoặc bất cứ vấn đề g&igrave; tại truyendocviet, như vấn đề bản quyền, nội dung kh&ocirc;ng được cho ph&eacute;p, vui l&ograve;ng gửi email đến cho ch&uacute;ng t&ocirc;i tại địa chỉ truyendocviet@gmail.com\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003EWe want to ensure that the content that we host can be re-used by other users without fear of liability and that it is not infringing the proprietary rights of others. However, we also recognize that not every takedown notice is valid or in good faith. For more information on what to do if you think a DMCA notice has been improperly filed, you may wish to consult the Chilling Effects website. If you are the owner of content that is being improperly used without your permission, you may request that the content be removed under the DMCA. To make such a request, please contact us via our email address truyendocviet@gmail.com. Before filing a DMCA claim, you also have the option of sending a notice via our email address truyendocviet@gmail.com.","Result":null,"Note":null,"IsActive":true,"ModifiedDate":"2026-05-07T08:09:51.720Z","Positions":[],"DataType":"news","Banner":"","Thumbnail":"","Icon":"","SeoTitle":"Điều Khoản Sử Dụng - Terms of Service","SeoUrl":"tos","SeoDescription":"Điều Khoản Sử Dụng - Terms of Service","SeoKeywords":"Điều Khoản Sử Dụng - Terms of Service","ShortName":"Điều Khoản Sử Dụng - Terms of Service","StyleCode":""},{"_id":464,"CategoryName":"Chính Sách Bảo Mật","CategoryTitle":"","Alias":"chinh-sach-bao-mat","CategoryOrder":30,"CategoryParent":0,"PortalKey":"vi","RefText":null,"RefUrl":null,"Recap":"","Description":"Giới Thiệu\u003Cbr \u002F\u003ECh&uacute;ng t&ocirc;i hiểu rằng bạn nhận thức v&agrave; quan t&acirc;m đến lợi &iacute;ch ri&ecirc;ng tư c&aacute; nh&acirc;n của bạn v&agrave; ch&uacute;ng t&ocirc;i coi trọng điều đ&oacute;. Th&ocirc;ng b&aacute;o về Quyền ri&ecirc;ng tư n&agrave;y nhằm gi&uacute;p bạn hiểu dữ liệu n&agrave;o ch&uacute;ng t&ocirc;i thu thập, l&yacute; do ch&uacute;ng t&ocirc;i thu thập, ch&uacute;ng t&ocirc;i l&agrave;m g&igrave; với dữ liệu đ&oacute; v&agrave; cũng quy định c&aacute;c quyền ri&ecirc;ng tư của bạn. Ch&uacute;ng t&ocirc;i nhận ra rằng bảo mật th&ocirc;ng tin l&agrave; tr&aacute;ch nhiệm li&ecirc;n tục v&agrave; v&igrave; vậy, ch&uacute;ng t&ocirc;i sẽ cập nhật Th&ocirc;ng b&aacute;o về quyền ri&ecirc;ng tư n&agrave;y theo thời gian khi ch&uacute;ng t&ocirc;i thực hiện c&aacute;c thực h&agrave;nh dữ liệu c&aacute; nh&acirc;n mới hoặc &aacute;p dụng c&aacute;c ch&iacute;nh s&aacute;ch bảo mật mới.\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EC&aacute;ch ch&uacute;ng t&ocirc;i thu thập v&agrave; sử dụng (xử l&yacute;) th&ocirc;ng tin c&aacute; nh&acirc;n của bạn\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ET&oacute;m Lược\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003Etruyendocviet thu thập th&ocirc;ng tin c&aacute; nh&acirc;n về những người d&ugrave;ng đ&atilde; đăng k&yacute; v&agrave; những kh&aacute;ch h&agrave;ng kh&aacute;c. Ch&uacute;ng t&ocirc;i sử dụng th&ocirc;ng tin n&agrave;y để n&acirc;ng cao trải nghiệm của bạn tr&ecirc;n trang web của ch&uacute;ng t&ocirc;i v&agrave; cung cấp dịch vụ cho bạn. C&aacute;c loại th&ocirc;ng tin ch&uacute;ng t&ocirc;i thu thập c&oacute; thể kh&aacute;c nhau, t&ugrave;y thuộc v&agrave;o c&aacute;ch bạn chọn sử dụng trang web của ch&uacute;ng t&ocirc;i. Ch&uacute;ng t&ocirc;i kh&ocirc;ng b&aacute;n th&ocirc;ng tin c&aacute; nh&acirc;n của bạn cho bất kỳ ai.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EMở Rộng\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ETh&ocirc;ng tin c&aacute; nh&acirc;n bạn cung cấp cho ch&uacute;ng t&ocirc;i:\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EĐăng K&yacute;\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EKhi bạn đăng k&yacute; v&agrave; tạo t&agrave;i khoản tr&ecirc;n trang web của ch&uacute;ng t&ocirc;i, ch&uacute;ng t&ocirc;i sẽ thu thập th&ocirc;ng tin về bạn, bao gồm t&ecirc;n, ng&agrave;y sinh, giới t&iacute;nh, địa chỉ email v&agrave; số điện thoại. Nếu bạn chọn đăng k&yacute; bằng hồ sơ mạng x&atilde; hội hiện c&oacute; của m&igrave;nh, ch&uacute;ng t&ocirc;i sẽ thu thập th&ocirc;ng tin từ hồ sơ của bạn, bao gồm (nhưng kh&ocirc;ng giới hạn) biệt hiệu, ảnh đại diện (ảnh), giới t&iacute;nh, ng&agrave;y sinh, ID hồ sơ hoặc URL. Người d&ugrave;ng c&oacute; thể chỉnh sửa hồ sơ của m&igrave;nh bất kỳ l&uacute;c n&agrave;o để thay đổi, th&ecirc;m hoặc x&oacute;a một số th&ocirc;ng tin c&aacute; nh&acirc;n nhất định, ngoại trừ ng&agrave;y sinh v&agrave; giới t&iacute;nh.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EThư từ của bạn với truyendocviet\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ENếu bạn trao đổi với ch&uacute;ng t&ocirc;i qua email, dịch vụ bưu ch&iacute;nh hoặc h&igrave;nh thức li&ecirc;n lạc kh&aacute;c, ch&uacute;ng t&ocirc;i c&oacute; thể giữ lại thư từ đ&oacute; v&agrave; th&ocirc;ng tin c&oacute; trong đ&oacute; v&agrave; sử dụng n&oacute; để trả lời c&acirc;u hỏi của bạn hoặc để lưu hồ sơ về khiếu nại, y&ecirc;u cầu chỗ ở của bạn, v&agrave; những thứ tương tự. Nếu bạn muốn truyendocviet &ldquo;x&oacute;a&rdquo; th&ocirc;ng tin c&aacute; nh&acirc;n của bạn hoặc kh&ocirc;ng cho ph&eacute;p li&ecirc;n lạc với bạn, vui l&ograve;ng li&ecirc;n hệ với ch&uacute;ng t&ocirc;i tại truyendocviet@gmail.com.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EMục đ&iacute;ch xử l&yacute; dữ liệu của bạn\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ENhư đ&atilde; giải th&iacute;ch ở tr&ecirc;n, truyendocviet xử l&yacute; dữ liệu của bạn để n&acirc;ng cao trải nghiệm của bạn tr&ecirc;n trang web của ch&uacute;ng t&ocirc;i v&agrave; cung cấp cho bạn c&aacute;c dịch vụ m&agrave; bạn y&ecirc;u cầu từ ch&uacute;ng t&ocirc;i. Bằng c&aacute;ch tạo t&agrave;i khoản, bạn c&oacute; quyền truy cập v&agrave;o c&aacute;c t&iacute;nh năng bổ sung, chẳng hạn như khả năng lưu s&aacute;ch v&agrave;o thư viện c&aacute; nh&acirc;n của m&igrave;nh, nhận th&ocirc;ng b&aacute;o về nội dung mới, mua hoặc xuất bản s&aacute;ch, theo d&otilde;i t&aacute;c giả y&ecirc;u th&iacute;ch của bạn, truy cập nội dung d&agrave;nh cho người trưởng th&agrave;nh, v.v.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ETh&ocirc;ng tin thẻ thanh to&aacute;n\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EBạn c&oacute; thể chọn truy cập nội dung trả ph&iacute; tr&ecirc;n truyendocviet bằng thẻ thanh to&aacute;n hoặc t&agrave;i khoản Paypal. Th&ocirc;ng thường, từ truyendocviet, người d&ugrave;ng được chuyển hướng đến trang web của một trong những dịch vụ xử l&yacute; thanh to&aacute;n m&agrave; truyendocviet đăng k&yacute;, nơi họ nhập th&ocirc;ng tin thanh to&aacute;n của m&igrave;nh. Bản th&acirc;n truyendocviet kh&ocirc;ng xử l&yacute; hoặc lưu trữ th&ocirc;ng tin thanh to&aacute;n. Ch&uacute;ng t&ocirc;i đặc biệt khuyến kh&iacute;ch bạn kh&ocirc;ng gửi th&ocirc;ng tin n&agrave;y qua email.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ESử dụng trang web https:\u002F\u002Ftruyendocviet.biz\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ET&oacute;m lược\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ENhư hầu hết c&aacute;c trang web kh&aacute;c, truyendocviet tự động thu thập một số th&ocirc;ng tin nhất định v&agrave; lưu trữ trong nhật k&yacute; m&aacute;y chủ. Th&ocirc;ng tin c&oacute; thể bao gồm địa chỉ giao thức internet (IP) v&agrave; loại tr&igrave;nh duyệt của bạn. Ch&uacute;ng t&ocirc;i c&oacute; thể sử dụng th&ocirc;ng tin n&agrave;y v&agrave; c&aacute;c th&ocirc;ng tin kh&aacute;c để gi&uacute;p chẩn đo&aacute;n sự cố với m&aacute;y chủ v&agrave; quản trị trang web của ch&uacute;ng t&ocirc;i. truyendocviet cũng sử dụng cookie v&agrave; đ&egrave;n hiệu web để thu thập số liệu thống k&ecirc; sử dụng, được ph&acirc;n t&iacute;ch s&acirc;u hơn v&agrave; được sử dụng để theo d&otilde;i c&aacute;c tương t&aacute;c của bạn với c&aacute;c trang web v&agrave; quảng c&aacute;o của ch&uacute;ng t&ocirc;i nhằm gi&uacute;p ch&uacute;ng t&ocirc;i ph&acirc;n t&iacute;ch xu hướng, theo d&otilde;i chuyển động của kh&aacute;ch truy cập v&agrave; thu thập th&ocirc;ng tin nh&acirc;n khẩu học rộng r&atilde;i hỗ trợ ch&uacute;ng t&ocirc;i trong việc x&aacute;c định sở th&iacute;ch của kh&aacute;ch truy cập.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ECookie v&agrave; b&aacute;o hiệu web\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ECookie l&agrave; những phần dữ liệu m&agrave; một trang web chuyển đến ổ cứng của người d&ugrave;ng nhằm mục đ&iacute;ch lưu trữ hồ sơ. B&aacute;o hiệu web l&agrave; h&igrave;nh ảnh pixel trong suốt được sử dụng để thu thập th&ocirc;ng tin về việc sử dụng trang web, phản hồi v&agrave; theo d&otilde;i e-mail.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ETrang web n&agrave;y sử dụng cookie v&agrave; đ&egrave;n hiệu Web để cung cấp chức năng n&acirc;ng cao tr&ecirc;n trang web (v&iacute; dụ: để gi&uacute;p bạn đăng nhập v&agrave;o t&agrave;i khoản của m&igrave;nh khi bạn đ&oacute;ng v&agrave; mở lại tr&igrave;nh duyệt hoặc để lưu dấu trang của bạn) v&agrave; tổng hợp dữ liệu lưu lượng truy cập (v&iacute; dụ: những trang l&agrave; phổ biến nhất). Những cookie n&agrave;y c&oacute; thể được ph&acirc;n phối trong ngữ cảnh của b&ecirc;n thứ nhất hoặc b&ecirc;n thứ ba. Trang web của ch&uacute;ng t&ocirc;i cũng nắm bắt th&ocirc;ng tin hạn chế (t&aacute;c nh&acirc;n người d&ugrave;ng, li&ecirc;n kết giới thiệu HTTP, URL cuối c&ugrave;ng được y&ecirc;u cầu bởi người d&ugrave;ng, d&ograve;ng nhấp chuột ph&iacute;a m&aacute;y kh&aacute;ch v&agrave; ph&iacute;a m&aacute;y chủ) về c&aacute;c lượt truy cập v&agrave;o Trang web của ch&uacute;ng t&ocirc;i; ch&uacute;ng t&ocirc;i c&oacute; thể sử dụng th&ocirc;ng tin n&agrave;y để ph&acirc;n t&iacute;ch c&aacute;c mẫu lưu lượng chung v&agrave; thực hiện bảo tr&igrave; hệ thống định kỳ. Bạn c&oacute; nhiều lựa chọn li&ecirc;n quan đến việc quản l&yacute; cookie tr&ecirc;n m&aacute;y t&iacute;nh của m&igrave;nh. Tất cả c&aacute;c tr&igrave;nh duyệt ch&iacute;nh đều cho ph&eacute;p bạn chặn hoặc x&oacute;a cookie khỏi hệ thống của m&igrave;nh. Để t&igrave;m hiểu th&ecirc;m về khả năng quản l&yacute; cookie v&agrave; b&aacute;o hiệu web của bạn,vui l&ograve;ng tham khảo c&aacute;c t&iacute;nh năng bảo mật trong tr&igrave;nh duyệt của bạn.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ETrang web n&agrave;y sử dụng Google Analytics, Tr&igrave;nh quản l&yacute; thẻ của Google, Đối tượng GA v&agrave; DoubleClick, c&aacute;c dịch vụ v&agrave; c&ocirc;ng cụ ph&acirc;n t&iacute;ch web được cung cấp bởi Google, Inc. (\"Google\"). Google sử dụng \"cookie\", l&agrave; c&aacute;c tệp văn bản được đặt tr&ecirc;n m&aacute;y t&iacute;nh của bạn, để gi&uacute;p trang web ph&acirc;n t&iacute;ch c&aacute;ch người d&ugrave;ng sử dụng trang web. Th&ocirc;ng tin được li&ecirc;n kết với cookie về việc bạn sử dụng trang web (bao gồm cả địa chỉ IP của bạn) c&oacute; thể được Google truyền đến v&agrave; lưu trữ tr&ecirc;n c&aacute;c m&aacute;y chủ của Google đặt tại nhiều quốc gia tr&ecirc;n thế giới, bao gồm cả Hoa Kỳ. Google sẽ sử dụng th&ocirc;ng tin n&agrave;y cho mục đ&iacute;ch đ&aacute;nh gi&aacute; việc sử dụng trang web của bạn, bi&ecirc;n soạn b&aacute;o c&aacute;o về hoạt động trang web cho c&aacute;c nh&agrave; điều h&agrave;nh trang web v&agrave; cung cấp c&aacute;c dịch vụ kh&aacute;c li&ecirc;n quan đến hoạt động trang web v&agrave; việc sử dụng internet. Google cũng c&oacute; thể chuyển th&ocirc;ng tin n&agrave;y cho c&aacute;c b&ecirc;n thứ ba nếu luật ph&aacute;p y&ecirc;u cầu,hoặc nơi c&aacute;c b&ecirc;n thứ ba xử l&yacute; th&ocirc;ng tin thay mặt Google. Google sẽ kh&ocirc;ng li&ecirc;n kết địa chỉ IP của bạn với bất kỳ dữ liệu n&agrave;o kh&aacute;c do Google nắm giữ. Bạn c&oacute; thể từ chối việc sử dụng cookie bằng c&aacute;ch chọn c&agrave;i đặt th&iacute;ch hợp tr&ecirc;n tr&igrave;nh duyệt của m&igrave;nh, tuy nhi&ecirc;n xin lưu &yacute; rằng nếu bạn l&agrave;m điều n&agrave;y, bạn c&oacute; thể kh&ocirc;ng sử dụng được to&agrave;n bộ chức năng của trang web n&agrave;y. Bạn cũng c&oacute; thể chọn kh&ocirc;ng tham gia quảng c&aacute;o được c&aacute; nh&acirc;n h&oacute;a của Google bằng c&aacute;ch truy cập C&agrave;i đặt Quảng c&aacute;o Ch&iacute;nh s&aacute;ch quyền ri&ecirc;ng tư của Google.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ECh&uacute;ng t&ocirc;i cũng sử dụng c&aacute;c C&ocirc;ng cụ kinh doanh của Facebook, bao gồm Facebook Connect, Facebook Custom Audience v&agrave; Facebook Pixel, được cung cấp bởi Facebook, Inc. (&ldquo;Facebook&rdquo;). Đ&acirc;y l&agrave; những c&ocirc;ng nghệ gi&uacute;p ch&uacute;ng t&ocirc;i t&iacute;ch hợp với Facebook, hiểu v&agrave; đo lường c&aacute;c sản phẩm v&agrave; dịch vụ của ch&uacute;ng t&ocirc;i, đồng thời tiếp cận v&agrave; phục vụ tốt hơn những người sử dụng hoặc c&oacute; thể quan t&acirc;m đến c&aacute;c sản phẩm v&agrave; dịch vụ của ch&uacute;ng t&ocirc;i. Tương tự như Google, Facebook sử dụng cookie để thu thập th&ocirc;ng tin khi bạn truy cập hoặc sử dụng trang web của ch&uacute;ng t&ocirc;i. Nếu bạn đ&atilde; đăng k&yacute; tr&ecirc;n trang web của ch&uacute;ng t&ocirc;i bằng hồ sơ Facebook của m&igrave;nh, Facebook c&oacute; thể li&ecirc;n kết th&ocirc;ng tin về c&aacute;c lượt truy cập v&agrave; h&agrave;nh động của bạn tr&ecirc;n trang web của ch&uacute;ng t&ocirc;i với th&ocirc;ng tin hồ sơ Facebook của bạn. Để đọc th&ecirc;m về thực tiễn thu thập dữ liệu v&agrave; thiết lập cookie của Facebook, vui l&ograve;ng đọc Ch&iacute;nh s&aacute;ch dữ liệu v&agrave; Ch&iacute;nh s&aacute;ch cookie . Bạn cũng c&oacute; thể sử dụng t&ugrave;y chọn quảng c&aacute;o Facebook của m&igrave;nh để t&igrave;m hiểu l&yacute; do tại sao bạn lại nh&igrave;n thấy một quảng c&aacute;o cụ thể v&agrave; kiểm so&aacute;t c&aacute;ch Facebook sử dụng th&ocirc;ng tin thu thập được để hiển thị quảng c&aacute;o cho bạn. Để hiển thị cho bạn những quảng c&aacute;o tốt hơn, Facebook sử dụng dữ liệu m&agrave; c&aacute;c nh&agrave; quảng c&aacute;o v&agrave; c&aacute;c đối t&aacute;c kh&aacute;c cung cấp về hoạt động của bạn ngo&agrave;i Sản phẩm của c&ocirc;ng ty Facebook, bao gồm c&aacute;c trang web v&agrave; ứng dụng. Bạn c&oacute; thể kiểm so&aacute;t xem Facebook c&oacute; sử dụng dữ liệu n&agrave;y để hiển thị quảng c&aacute;o cho bạn trong c&agrave;i đặt quảng c&aacute;o Facebook của bạn hay kh&ocirc;ng .\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ENếu bạn ở Li&ecirc;n minh Ch&acirc;u u, việc chuyển th&ocirc;ng tin của bạn từ EEA sang Hoa Kỳ được cho ph&eacute;p theo Điều 45 của Quy định chung về bảo vệ dữ liệu (GDPR), v&igrave; Google v&agrave; Facebook tu&acirc;n thủ quyền tự điều chỉnh của Bảo vệ quyền ri&ecirc;ng tư của Hoa Kỳ-Li&ecirc;n minh Ch&acirc;u &Acirc;u khu&ocirc;n khổ. Bạn c&oacute; thể t&igrave;m thấy chi tiết của khu&ocirc;n khổ tại đ&acirc;y.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EBạn c&oacute; thể chọn kh&ocirc;ng xem quảng c&aacute;o trực tuyến dựa tr&ecirc;n sở th&iacute;ch từ Facebook, Google v&agrave; c&aacute;c c&ocirc;ng ty tham gia kh&aacute;c th&ocirc;ng qua Li&ecirc;n minh quảng c&aacute;o kỹ thuật số tương t&aacute;c Ch&acirc;u &Acirc;u ở Ch&acirc;u &Acirc;u, Li&ecirc;n minh quảng c&aacute;o kỹ thuật số ở Hoa Kỳ, Li&ecirc;n minh quảng c&aacute;o kỹ thuật số của Canada ở Canada hoặc th&ocirc;ng qua điện thoại di động của bạn c&agrave;i đặt thiết bị. Xin lưu &yacute; rằng c&aacute;c tr&igrave;nh chặn quảng c&aacute;o v&agrave; c&aacute;c c&ocirc;ng cụ hạn chế sử dụng cookie c&oacute; thể ảnh hưởng đến c&aacute;c kiểm so&aacute;t n&agrave;y.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EBằng c&aacute;ch sử dụng truyendocviet, bạn đồng &yacute; với việc Google v&agrave; Facebook xử l&yacute; dữ liệu về bạn theo c&aacute;ch thức v&agrave; c&aacute;c mục đ&iacute;ch n&ecirc;u tr&ecirc;n.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EKhi n&agrave;o v&agrave; c&aacute;ch ch&uacute;ng t&ocirc;i chia sẻ th&ocirc;ng tin với người kh&aacute;c\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ETh&ocirc;ng tin c&aacute; nh&acirc;n m&agrave; truyendocviet thu thập từ bạn được lưu trữ trong một hoặc nhiều cơ sở dữ liệu do c&aacute;c b&ecirc;n thứ ba lưu trữ tr&ecirc;n c&aacute;c m&aacute;y chủ đặt tại Đức. C&aacute;c b&ecirc;n thứ ba n&agrave;y kh&ocirc;ng sử dụng hoặc c&oacute; quyền truy cập v&agrave;o th&ocirc;ng tin c&aacute; nh&acirc;n của bạn cho bất kỳ mục đ&iacute;ch n&agrave;o kh&aacute;c ngo&agrave;i việc lưu trữ v&agrave; truy xuất.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ECh&uacute;ng t&ocirc;i kh&ocirc;ng tiết lộ dữ liệu c&aacute; nh&acirc;n của bạn cho b&ecirc;n thứ ba để họ sử dụng độc lập trừ khi:\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E(1) Bạn y&ecirc;u cầu hoặc cho ph&eacute;p\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E(2) Th&ocirc;ng tin được cung cấp để tu&acirc;n thủ luật ph&aacute;p (v&iacute; dụ: tu&acirc;n thủ lệnh kh&aacute;m x&eacute;t, tr&aacute;t đ&ograve;i hầu t&ograve;a hoặc lệnh t&ograve;a), thực thi thỏa thuận m&agrave; ch&uacute;ng t&ocirc;i c&oacute; với bạn hoặc để bảo vệ quyền, t&agrave;i sản hoặc sự an to&agrave;n của ch&uacute;ng t&ocirc;i hoặc c&aacute;c quyền , t&agrave;i sản hoặc sự an to&agrave;n của nh&acirc;n vi&ecirc;n của ch&uacute;ng t&ocirc;i hoặc những người kh&aacute;c\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E(3) Th&ocirc;ng tin được cung cấp cho c&aacute;c đại l&yacute;, nh&agrave; cung cấp hoặc nh&agrave; cung cấp dịch vụ của ch&uacute;ng t&ocirc;i, những người thực hiện c&aacute;c chức năng thay mặt ch&uacute;ng t&ocirc;i\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E(4) Để giải quyết c&aacute;c trường hợp khẩn cấp hoặc h&agrave;nh động của Ch&uacute;a.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E(5) Để giải quyết c&aacute;c tranh chấp, khiếu nại, hoặc với những người chứng minh quyền hợp ph&aacute;p để thay mặt bạn h&agrave;nh động.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EQuyền chủ thể dữ liệu\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ET&oacute;m lược\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EQuy định chung về bảo vệ dữ liệu của Li&ecirc;n minh Ch&acirc;u &Acirc;u v&agrave; luật bảo mật của c&aacute;c quốc gia kh&aacute;c cung cấp c&aacute;c quyền nhất định cho c&aacute;c chủ thể dữ liệu.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ETh&ocirc;ng b&aacute;o về Quyền ri&ecirc;ng tư n&agrave;y nhằm cung cấp cho bạn th&ocirc;ng tin về những dữ liệu c&aacute; nh&acirc;n m&agrave; truyendocviet thu thập về bạn v&agrave; c&aacute;ch dữ liệu đ&oacute; được sử dụng. Nếu bạn c&oacute; bất kỳ c&acirc;u hỏi n&agrave;o, vui l&ograve;ng li&ecirc;n hệ với ch&uacute;ng t&ocirc;i tại truyendocviet@gmail.com\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EMở rộng\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ENếu bạn muốn x&aacute;c nhận rằng truyendocviet đang xử l&yacute; dữ liệu c&aacute; nh&acirc;n của bạn hoặc để c&oacute; quyền truy cập v&agrave;o dữ liệu c&aacute; nh&acirc;n m&agrave; truyendocviet c&oacute; thể c&oacute; về bạn, vui l&ograve;ng li&ecirc;n hệ với ch&uacute;ng t&ocirc;i tại\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EBạn cũng c&oacute; thể y&ecirc;u cầu th&ocirc;ng tin về: mục đ&iacute;ch của qu&aacute; tr&igrave;nh xử l&yacute;; c&aacute;c loại dữ liệu c&aacute; nh&acirc;n c&oacute; li&ecirc;n quan; ai kh&aacute;c b&ecirc;n ngo&agrave;i truyendocviet c&oacute; thể đ&atilde; nhận dữ liệu từ truyendocviet; nguồn của th&ocirc;ng tin l&agrave; g&igrave; (nếu bạn kh&ocirc;ng cung cấp trực tiếp cho truyendocviet); v&agrave; n&oacute; sẽ được lưu trữ trong bao l&acirc;u.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EBạn c&oacute; quyền sửa chữa (cải ch&iacute;nh) hồ sơ dữ liệu c&aacute; nh&acirc;n của bạn do truyendocviet lưu giữ nếu n&oacute; kh&ocirc;ng ch&iacute;nh x&aacute;c. Bạn c&oacute; thể y&ecirc;u cầu truyendocviet x&oacute;a dữ liệu đ&oacute; hoặc ngừng xử l&yacute; dữ liệu đ&oacute;, t&ugrave;y thuộc v&agrave;o một số ngoại lệ nhất định. Ở nhiều quốc gia, bạn c&oacute; quyền khiếu nại với cơ quan bảo vệ dữ liệu th&iacute;ch hợp nếu bạn lo ngại về c&aacute;ch truyendocviet xử l&yacute; dữ liệu c&aacute; nh&acirc;n của bạn. Khi khả thi về mặt kỹ thuật, truyendocviet sẽ &mdash; theo y&ecirc;u cầu của bạn &mdash; cung cấp dữ liệu c&aacute; nh&acirc;n của bạn cho bạn hoặc truyền trực tiếp dữ liệu đ&oacute; đến một bộ điều khiển kh&aacute;c, t&ugrave;y thuộc v&agrave;o một số ngoại lệ nhất định.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EQuyền truy cập hợp l&yacute; v&agrave;o dữ liệu c&aacute; nh&acirc;n của bạn sẽ được cung cấp miễn ph&iacute; theo y&ecirc;u cầu của truyendocviet tại truyendocviet@gmail.com. Nếu kh&ocirc;ng thể cung cấp quyền truy cập trong một khung thời gian hợp l&yacute;, truyendocviet sẽ cung cấp cho bạn ng&agrave;y th&ocirc;ng tin sẽ được cung cấp. Nếu v&igrave; l&yacute; do n&agrave;o đ&oacute; m&agrave; quyền truy cập bị từ chối, truyendocviet sẽ đưa ra lời giải th&iacute;ch tại sao quyền truy cập bị từ chối.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ECơ sở ph&aacute;p l&yacute; để xử l&yacute;\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ECh&uacute;ng t&ocirc;i xử l&yacute; th&ocirc;ng tin của bạn cho c&aacute;c mục đ&iacute;ch được m&ocirc; tả trong th&ocirc;ng b&aacute;o n&agrave;y, dựa tr&ecirc;n c&aacute;c cơ sở ph&aacute;p l&yacute; sau:\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EKhi ch&uacute;ng ta theo đuổi lợi &iacute;ch hợp ph&aacute;p\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ECh&uacute;ng t&ocirc;i xử l&yacute; th&ocirc;ng tin của bạn v&igrave; lợi &iacute;ch hợp ph&aacute;p của ch&uacute;ng t&ocirc;i v&agrave; của c&aacute;c b&ecirc;n thứ ba trong khi &aacute;p dụng c&aacute;c biện ph&aacute;p bảo vệ th&iacute;ch hợp để bảo vệ quyền ri&ecirc;ng tư của bạn. Điều n&agrave;y c&oacute; nghĩa l&agrave; ch&uacute;ng t&ocirc;i xử l&yacute; th&ocirc;ng tin của bạn cho những thứ như:\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ECung cấp, duy tr&igrave; v&agrave; cải tiến c&aacute;c dịch vụ của ch&uacute;ng t&ocirc;i để đ&aacute;p ứng nhu cầu của người d&ugrave;ng\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EPh&aacute;t triển c&aacute;c sản phẩm v&agrave; t&iacute;nh năng mới hữu &iacute;ch cho người d&ugrave;ng của ch&uacute;ng t&ocirc;i\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EHiểu c&aacute;ch mọi người sử dụng dịch vụ của ch&uacute;ng t&ocirc;i để đảm bảo v&agrave; cải thiện hiệu suất của c&aacute;c dịch vụ của ch&uacute;ng t&ocirc;i\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ET&ugrave;y chỉnh c&aacute;c dịch vụ của ch&uacute;ng t&ocirc;i để cung cấp cho bạn trải nghiệm người d&ugrave;ng tốt hơn\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EPh&aacute;t hiện, ngăn chặn hoặc giải quyết c&aacute;c vấn đề gian lận, lạm dụng, bảo mật hoặc kỹ thuật với c&aacute;c dịch vụ của ch&uacute;ng t&ocirc;i\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EBảo vệ kh&ocirc;ng g&acirc;y tổn hại đến quyền, t&agrave;i sản hoặc sự an to&agrave;n của truyendocviet, người d&ugrave;ng của ch&uacute;ng t&ocirc;i hoặc c&ocirc;ng ch&uacute;ng theo y&ecirc;u cầu hoặc được ph&aacute;p luật cho ph&eacute;p\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EThực hiện nghĩa vụ đối với c&aacute;c đối t&aacute;c của ch&uacute;ng t&ocirc;i như nh&agrave; ph&aacute;t triển v&agrave; chủ sở hữu quyền\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EThực thi c&aacute;c khiếu nại ph&aacute;p l&yacute;, bao gồm cả việc điều tra c&aacute;c vi phạm tiềm ẩn đối với Điều khoản dịch vụ hiện h&agrave;nh\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EKhi ch&uacute;ng t&ocirc;i cung cấp dịch vụ\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ECh&uacute;ng t&ocirc;i xử l&yacute; dữ liệu của bạn để cung cấp dịch vụ m&agrave; bạn đ&atilde; y&ecirc;u cầu theo hợp đồng. V&iacute; dụ: ch&uacute;ng t&ocirc;i thu thập bản sao giấy tờ t&ugrave;y th&acirc;n do ch&iacute;nh phủ cấp của bạn v&agrave; xử l&yacute; hệ thống thanh to&aacute;n hoặc th&ocirc;ng tin ng&acirc;n h&agrave;ng của bạn khi bạn muốn xuất bản nội dung trả ph&iacute; hoặc cố gắng r&uacute;t tiền từ số dư ảo của bạn tr&ecirc;n trang web của ch&uacute;ng t&ocirc;i.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EKhi ch&uacute;ng t&ocirc;i tu&acirc;n thủ c&aacute;c nghĩa vụ ph&aacute;p l&yacute;\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ECh&uacute;ng t&ocirc;i sẽ xử l&yacute; dữ liệu của bạn khi ch&uacute;ng t&ocirc;i c&oacute; nghĩa vụ ph&aacute;p l&yacute; phải l&agrave;m như vậy, chẳng hạn như nếu ch&uacute;ng t&ocirc;i đang phản hồi quy tr&igrave;nh ph&aacute;p l&yacute; hoặc y&ecirc;u cầu c&oacute; thể thực thi của ch&iacute;nh phủ.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EBảo mật th&ocirc;ng tin của bạn\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EĐể gi&uacute;p bảo vệ quyền ri&ecirc;ng tư của dữ liệu v&agrave; th&ocirc;ng tin nhận dạng c&aacute; nh&acirc;n m&agrave; bạn truyền tải th&ocirc;ng qua việc sử dụng trang web của ch&uacute;ng t&ocirc;i, ch&uacute;ng t&ocirc;i duy tr&igrave; c&aacute;c biện ph&aacute;p bảo vệ vật l&yacute;, kỹ thuật v&agrave; h&agrave;nh ch&iacute;nh. Ch&uacute;ng t&ocirc;i li&ecirc;n tục cập nhật v&agrave; kiểm tra c&ocirc;ng nghệ bảo mật của m&igrave;nh. Ch&uacute;ng t&ocirc;i hạn chế quyền truy cập v&agrave;o dữ liệu c&aacute; nh&acirc;n của bạn đối với những nh&acirc;n vi&ecirc;n cần biết th&ocirc;ng tin đ&oacute; để cung cấp lợi &iacute;ch hoặc dịch vụ cho bạn. Ngo&agrave;i ra, ch&uacute;ng t&ocirc;i đ&agrave;o tạo nh&acirc;n vi&ecirc;n của m&igrave;nh về tầm quan trọng của t&iacute;nh bảo mật v&agrave; duy tr&igrave; sự ri&ecirc;ng tư v&agrave; bảo mật th&ocirc;ng tin của bạn. Ch&uacute;ng t&ocirc;i cam kết thực hiện c&aacute;c biện ph&aacute;p kỷ luật th&iacute;ch hợp để thực thi tr&aacute;ch nhiệm về quyền ri&ecirc;ng tư của nh&acirc;n vi&ecirc;n.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003ELưu trữ v&agrave; lưu giữ dữ liệu\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EDữ liệu c&aacute; nh&acirc;n của bạn được truyendocviet lưu trữ tr&ecirc;n (c&aacute;c) m&aacute;y chủ chuy&ecirc;n dụng đặt tại Đức. truyendocviet giữ lại dữ liệu trong suốt thời gian kh&aacute;ch h&agrave;ng quan hệ với truyendocviet, cộng th&ecirc;m s&aacute;u th&aacute;ng. Để biết th&ecirc;m th&ocirc;ng tin về nơi v&agrave; thời gian lưu trữ dữ liệu c&aacute; nh&acirc;n của bạn cũng như để biết th&ecirc;m th&ocirc;ng tin về quyền x&oacute;a v&agrave; t&iacute;nh di động của bạn, vui l&ograve;ng li&ecirc;n hệ với ch&uacute;ng t&ocirc;i tại truyendocviet@gmail.com\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EC&aacute;c thay đổi v&agrave; cập nhật đối với Th&ocirc;ng b&aacute;o về quyền ri&ecirc;ng tư\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003EBằng c&aacute;ch sử dụng truyendocviet, bạn đồng &yacute; với c&aacute;c điều khoản v&agrave; điều kiện c&oacute; trong Th&ocirc;ng b&aacute;o về Quyền ri&ecirc;ng tư n&agrave;y v&agrave; \u002F hoặc bất kỳ thỏa thuận n&agrave;o kh&aacute;c m&agrave; ch&uacute;ng t&ocirc;i c&oacute; thể c&oacute; với bạn. Nếu bạn kh&ocirc;ng đồng &yacute; với bất kỳ điều khoản v&agrave; điều kiện n&agrave;o, bạn kh&ocirc;ng n&ecirc;n sử dụng trang web n&agrave;y hoặc bất kỳ dịch vụ truyendocviet n&agrave;o.\u003C\u002Fspan\u003E\u003Cbr \u002F\u003E\u003Cspan style=\"font-size:12px;\"\u003E\u003Cbr \u002F\u003E\u003C\u002Fspan\u003E\u003Cbr \u002F\u003EKhi tổ chức, tư c&aacute;ch th&agrave;nh vi&ecirc;n v&agrave; lợi &iacute;ch của ch&uacute;ng t&ocirc;i thay đổi theo thời gian, Th&ocirc;ng b&aacute;o về Quyền ri&ecirc;ng tư n&agrave;y cũng sẽ thay đổi. Ch&uacute;ng t&ocirc;i c&oacute; quyền sửa đổi Th&ocirc;ng b&aacute;o về Quyền ri&eci
