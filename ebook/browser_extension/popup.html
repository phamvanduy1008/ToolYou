<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DTV EPUB Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>DTV EPUB Exporter</h1>
  <p id="current">Mở một trang danh mục DTV rồi nhấn Bắt đầu.</p>
  <pre id="status">Sẵn sàng</pre>
  <div class="actions">
    <button id="start">Bắt đầu mới</button>
    <button id="resume">Tiếp tục</button>
    <button id="export" class="secondary">Xuất phần đã lấy</button>
    <button id="import" class="secondary">Nhập JSON để tiếp tục</button>
    <button id="stop" class="secondary">Dừng</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
