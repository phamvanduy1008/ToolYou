<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nhập dữ liệu DTV</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Nhập JSON để tiếp tục</h1>
  <p>Chọn file đã tạo bằng “Xuất phần đã lấy”. Extension sẽ giữ các truyện trong file và tìm phần còn thiếu.</p>
  <pre id="status">Sẵn sàng chọn file JSON.</pre>
  <input id="file" type="file" accept=".json,application/json">
  <button id="import">Nhập và tiếp tục</button>
  <script src="import.js"></script>
</body>
</html>
